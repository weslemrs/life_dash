/* =================== PROJETOS =================== */
const ST_PROJ = ['Ideia', 'Em andamento', 'Pausado', 'Concluído'];
const ST_TAR = ['A fazer', 'Fazendo', 'Feito', 'Adiado'];
const ST_SPR = ['Planejada', 'Ativa', 'Concluída'];
const PJ = () => D.proj || { projetos: [], sprints: [], tarefas: [] };
const tarefasDe = nome => PJ().tarefas.filter(t => t.projeto === nome);
const sprintsDe = nome => PJ().sprints.filter(s => s.projeto === nome).sort((a, b) => a.ini < b.ini ? -1 : 1);
const sprintAtiva = nome => { const ss = sprintsDe(nome); return ss.find(s => s.status === 'Ativa') || ss.find(s => s.status !== 'Concluída' && s.ini <= D.hoje && D.hoje <= s.fim) || null; };
const semanaIni = iso => addDias(iso, -((new Date(iso + 'T12:00:00').getDay() + 6) % 7)); // segunda

function metricasProjeto(p) {
  const ts = tarefasDe(p.nome), feitas = ts.filter(t => t.status === 'Feito'), abertas = ts.filter(t => t.status !== 'Feito');
  const h = D.hoje, atrasadas = abertas.filter(t => t.d && t.d < h);
  const prog = ts.length ? feitas.length / ts.length : 0;
  const desde4 = addDias(h, -27);
  const vel = feitas.filter(t => t.concluida && t.concluida >= desde4).length / 4; // tarefas por semana (4 semanas)
  const semanas = vel > 0 ? abertas.length / vel : null;
  const previsao = abertas.length === 0 ? null : semanas != null ? addDias(h, Math.ceil(semanas * 7)) : null;
  const dPrazo = p.prazo ? diasAte(p.prazo) : null;
  let saude = 'ok', saudeTxt = 'no ritmo';
  if (p.status === 'Concluído' || (ts.length && !abertas.length)) { saude = 'ok'; saudeTxt = 'concluído'; }
  else if (dPrazo != null && dPrazo < 0) { saude = 'bad'; saudeTxt = 'prazo vencido'; }
  else if (p.prazo && abertas.length && (!previsao || previsao > p.prazo)) { saude = previsao ? 'bad' : 'warn'; saudeTxt = previsao ? 'vai atrasar' : 'sem ritmo'; }
  else if (atrasadas.length) { saude = 'warn'; saudeTxt = atrasadas.length + ' atrasada(s)'; }
  const horas = soma(abertas.filter(t => t.estim != null), t => t.estim);
  return { ts, feitas, abertas, atrasadas, prog, vel, previsao, dPrazo, saude, saudeTxt, horas, sprint: sprintAtiva(p.nome) };
}

function chipSaude(m) { return `<span class="tag ${m.saude === 'bad' ? 'late' : m.saude === 'warn' ? 'hot' : 'ok'}">${esc(m.saudeTxt)}</span>`; }

function cartaoTarefa(t, subs) {
  const h = D.hoje, late = t.status !== 'Feito' && t.d && t.d < h;
  const sp = t.sprint ? PJ().sprints.find(s => s.id === t.sprint) : null;
  const sd = subs.filter(x => x.status === 'Feito').length;
  const mover = t.status === 'Feito' ? `<button class="kb" onclick="moverTarefa('${t.id}','A fazer')" title="Reabrir">↺</button>`
    : t.status === 'Fazendo' ? `<button class="kb" onclick="moverTarefa('${t.id}','A fazer')" title="Voltar">←</button><button class="kb ok" onclick="moverTarefa('${t.id}','Feito')" title="Concluir">✓</button>`
    : `<button class="kb" onclick="moverTarefa('${t.id}','Fazendo')" title="Começar">▶</button><button class="kb ok" onclick="moverTarefa('${t.id}','Feito')" title="Concluir">✓</button>`;
  return `<div class="kt ${t.status === 'Feito' ? 'done' : ''} ${t.prio === 'Alta' ? 'alta' : ''}">
    <div class="kt-t">${esc(t.tarefa)}${t.rec ? ` <span title="${esc(t.regra ? t.regra.desc : 'recorrente')}">🔁</span>` : ''}</div>
    <div class="kt-m">${t.d ? `<span class="${late ? 'neg' : ''}">${late ? '⚠ ' : ''}${ddmm(t.d)}</span>` : ''}${sp ? `<span>${esc(sp.nome)}</span>` : ''}${t.estim != null ? `<span>${num(t.estim, t.estim % 1 ? 1 : 0)} h</span>` : ''}${t.status === 'Adiado' ? '<span>adiada</span>' : ''}${subs.length ? `<span>☑ ${sd}/${subs.length}</span>` : ''}</div>
    ${subs.length ? `<div class="kt-subs">${subs.map(x => `<label class="subt ${x.status === 'Feito' ? 'done' : ''}"><input type="checkbox" ${x.status === 'Feito' ? 'checked' : ''} onchange="moverTarefa('${x.id}', this.checked ? 'Feito' : 'A fazer')"><span>${esc(x.tarefa)}</span></label>`).join('')}</div>` : ''}
    <div class="kt-a">${mover}<button class="kb" onclick="editarItem('tarefa','${t.id}')" title="Editar">✎</button><button class="kb" onclick="novaSub('${t.id}')" title="Nova subtarefa">+ sub</button></div></div>`;
}

function kanban(p) {
  const ts = tarefasDe(p.nome), ids = new Set(ts.map(t => t.id));
  const tops = ts.filter(t => !t.pai || !ids.has(t.pai));
  const subsDe = id => ts.filter(t => t.pai === id);
  const ordem = (a, b) => (a.prio === 'Alta' ? 0 : a.prio === 'Média' ? 1 : 2) - (b.prio === 'Alta' ? 0 : b.prio === 'Média' ? 1 : 2) || ((a.d || '9') < (b.d || '9') ? -1 : 1);
  const col = (tit, lista, extra) => `<div class="kcol"><div class="kh">${tit} <b>${lista.length}</b></div>${lista.map(t => cartaoTarefa(t, subsDe(t.id))).join('') || '<div class="empty" style="padding:6px 2px">—</div>'}${extra || ''}</div>`;
  const feitos = tops.filter(t => t.status === 'Feito').sort((a, b) => (a.concluida || '') < (b.concluida || '') ? 1 : -1);
  return `<div class="kanban">
    ${col('A fazer', tops.filter(t => t.status === 'A fazer' || t.status === 'Adiado').sort(ordem))}
    ${col('Fazendo', tops.filter(t => t.status === 'Fazendo').sort(ordem))}
    ${col('Feito', feitos.slice(0, 6), feitos.length > 6 ? `<div class="m" style="font-size:11.5px;color:var(--ink3);padding:4px">+ ${feitos.length - 6} concluída(s)</div>` : '')}
  </div>`;
}

const ORDEM_ST = { 'Em andamento': 0, 'Ideia': 1, 'Pausado': 2, 'Concluído': 3 };
function projetosOrdenados() {
  return PJ().projetos.slice().sort((a, b) => ((ORDEM_ST[a.status] ?? 4) - (ORDEM_ST[b.status] ?? 4)) || ((a.prazo || '9') < (b.prazo || '9') ? -1 : (a.prazo || '9') > (b.prazo || '9') ? 1 : 0));
}
/* ---- seletores de visão (lembrados neste aparelho) ---- */
const lerPref = (k, d) => { try { return localStorage.getItem(k) || d; } catch (e) { return d; } };
const salvarPref = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
let projSel = lerPref('ld_proj', ''), conhSel = lerPref('ld_conh', 'faculdade');
function redesenhar(aba) {
  Object.keys(charts).forEach(k => { const c = charts[k]; if (c && c.canvas && document.getElementById('tab-' + aba).contains(c.canvas)) { c.destroy(); delete charts[k]; } });
  ({ projetos: renderProjetos, faculdade: renderFaculdade })[aba]();
  ({ projetos: graficosProjetos, faculdade: graficosFaculdade })[aba]();
}
function verProjeto(nome) { projSel = nome; salvarPref('ld_proj', nome); redesenhar('projetos'); }
function escolherConh(m) { conhSel = m; salvarPref('ld_conh', m); redesenhar('faculdade'); }
function renderProjetos() {
  const ps = projetosOrdenados();
  const ms = ps.map(p => ({ p, m: metricasProjeto(p) }));
  const ativos = ps.filter(p => p.status === 'Em andamento').length;
  const todas = PJ().tarefas, abertas = todas.filter(t => t.status !== 'Feito');
  const semana = todas.filter(t => t.concluida && t.concluida >= addDias(D.hoje, -6)).length;
  const atras = abertas.filter(t => t.d && t.d < D.hoje).length;
  const horas = soma(abertas.filter(t => t.estim != null), t => t.estim);

  const visao = ms.map(({ p, m }) => `<div class="row lk" onclick="abrirProjeto('${esc(p.nome).replace(/'/g, "\\'")}')"><div><span class="t">${esc(p.nome)}</span><span class="tag">${esc(p.status)}</span>${chipSaude(m)}
      <div class="m">${m.feitas.length}/${m.ts.length} tarefas${p.prazo ? ' · prazo ' + ddmm(p.prazo) + ' (' + quando(m.dPrazo) + ')' : ''}${m.previsao ? ' · previsão ' + ddmm(m.previsao) : ''}</div></div>
      <div class="v">${pct(m.prog)}</div><div class="bar"><i class="${m.prog >= 1 ? 'ok' : m.saude === 'bad' ? 'bad' : 'mg'}" style="width:${(m.prog * 100).toFixed(0)}%"></i></div></div>`).join('');

  if (!ps.some(p => p.nome === projSel)) projSel = (ps.find(p => p.status === 'Em andamento') || ps[0] || {}).nome || '';
  const seletor = ps.length > 1 ? `<div class="card c12" style="padding:12px 14px"><div class="chips" style="margin:0">${ps.map(p => `<button type="button" class="${p.nome === projSel ? 'on' : ''}" onclick="verProjeto(this.dataset.v)" data-v="${esc(p.nome)}">${esc(p.nome)}</button>`).join('')}</div></div>` : '';
  const cards = ms.map(({ p, m }, i) => {
    if (p.nome !== projSel) return '';
    const s = m.sprint, sTs = s ? m.ts.filter(t => t.sprint === s.id) : [], sF = sTs.filter(t => t.status === 'Feito').length;
    const spr = s ? `<div class="psec"><div class="lb">Sprint atual</div>
        <div class="kv" style="margin-top:4px"><span><b style="color:var(--ink)">${esc(s.nome)}</b> · ${ddmm(s.ini)}–${ddmm(s.fim)}${s.objetivo ? ' · ' + esc(s.objetivo) : ''}</span><b>${sF}/${sTs.length} · ${diasAte(s.fim) >= 0 ? (diasAte(s.fim) === 0 ? 'último dia' : 'faltam ' + diasAte(s.fim) + ' d') : 'encerrou'}</b></div>
        <div class="bar" style="margin:8px 0"><i class="${sTs.length && sF === sTs.length ? 'ok' : ''}" style="width:${sTs.length ? (sF / sTs.length * 100).toFixed(0) : 0}%"></i></div>
        <div class="chart" style="height:170px"><canvas id="bd-${i}"></canvas></div></div>`
      : `<div class="psec"><div class="empty">Nenhuma sprint ativa. <button class="go2" onclick="novoItem('sprint','${esc(p.nome).replace(/'/g, "\\'")}')">criar sprint ›</button></div></div>`;
    const outras = sprintsDe(p.nome).filter(x => !s || x.id !== s.id);
    return `<div class="card c12 proj" data-k="proj-${esc(p.nome)}">
      <h3>${esc(p.nome)} <small>${esc(p.status)} · ${pct(m.prog)}</small></h3>
      ${p.objetivo ? `<div class="m" style="color:var(--ink2);font-size:13.5px;margin:-4px 0 12px">🎯 ${esc(p.objetivo)}</div>` : ''}
      <div class="ptiles">
        <div class="tile"><div class="n">Progresso</div><div class="v">${pct(m.prog)}</div><div class="bar"><i class="${m.prog >= 1 ? 'ok' : 'mg'}" style="width:${(m.prog * 100).toFixed(0)}%"></i></div></div>
        <div class="tile"><div class="n">Abertas</div><div class="v">${m.abertas.length}<small> / ${m.ts.length}</small></div></div>
        <div class="tile"><div class="n">Atrasadas</div><div class="v ${m.atrasadas.length ? 'neg' : ''}">${m.atrasadas.length}</div></div>
        <div class="tile"><div class="n">Ritmo</div><div class="v">${num(m.vel, 1)}<small> /sem</small></div></div>
        <div class="tile"><div class="n">Prazo</div><div class="v ${m.dPrazo != null && m.dPrazo < 0 ? 'neg' : ''}" style="font-size:14px">${p.prazo ? ddmm(p.prazo) + '<small> ' + quando(m.dPrazo) + '</small>' : '—'}</div></div>
        <div class="tile"><div class="n">Previsão</div><div class="v" style="font-size:14px">${m.previsao ? ddmm(m.previsao) : m.abertas.length ? 'sem ritmo' : 'pronto'} ${chipSaude(m)}</div></div>
      </div>
      ${m.horas ? `<div class="m" style="font-size:12px;color:var(--ink3);margin:-4px 0 10px">≈ ${num(m.horas, 1)} h estimadas nas tarefas abertas</div>` : ''}
      ${spr}
      <div class="psec"><div class="lb">Quadro</div>${kanban(p)}</div>
      ${outras.length ? `<div class="psec"><div class="lb">Outras sprints</div>${outras.map(x => `<div class="row"><div><span class="t">${esc(x.nome)}</span><span class="tag">${esc(x.status)}</span><div class="m">${ddmm(x.ini)}–${ddmm(x.fim)}${x.objetivo ? ' · ' + esc(x.objetivo) : ''}</div></div><div class="v">${m.ts.filter(t => t.sprint === x.id && t.status === 'Feito').length}/${m.ts.filter(t => t.sprint === x.id).length} <button class="kb" onclick="editarItem('sprint','${x.id}')">✎</button></div></div>`).join('')}</div>` : ''}
      <div class="pacts">
        <button class="mini" onclick="novoItem('tarefa','${esc(p.nome).replace(/'/g, "\\'")}')">+ Tarefa</button>
        <button class="mini ghost" onclick="novoItem('sprint','${esc(p.nome).replace(/'/g, "\\'")}')">+ Sprint</button>
        <button class="mini ghost" onclick="editarItem('projeto','${esc(p.nome).replace(/'/g, "\\'")}')">✎ Projeto</button>
      </div>
    </div>`;
  }).join('');

  $('#tab-projetos').innerHTML = `
  <div class="grid">
    <div class="card kpi c3"><div class="lbl">Projetos ativos</div><div class="val">${ativos}</div><div class="sub">${ps.length} no total</div></div>
    <div class="card kpi c3"><div class="lbl">Tarefas abertas</div><div class="val">${abertas.length}</div><div class="sub ${atras ? 'neg' : ''}">${atras ? atras + ' atrasada(s)' : 'nenhuma atrasada'}</div></div>
    <div class="card kpi c3"><div class="lbl">Concluídas em 7 dias</div><div class="val pos">${semana}</div><div class="sub">em todos os projetos</div></div>
    <div class="card kpi c3"><div class="lbl">Trabalho estimado</div><div class="val">${num(horas, 1)} h</div><div class="sub">nas tarefas abertas</div></div>
    ${ps.length ? `<div class="card c12"><h3>Visão geral <button class="go2" onclick="novoItem('projeto')">+ novo projeto</button></h3>${visao}</div>
    <div class="card c12"><h3>Entregas por semana <small>tarefas concluídas, 8 semanas</small></h3><div class="chart"><canvas id="chProjSem"></canvas></div></div>
    <div class="sect c12">Projeto</div>${seletor}${cards}`
    : `<div class="card c12"><div class="empty">Nenhum projeto ainda. <button class="go2" onclick="novoItem('projeto')">criar o primeiro projeto ›</button></div></div>`}
  </div>`;
}

function graficosProjetos() {
  if (!window.Chart) return;
  Object.keys(charts).filter(k => k.indexOf('pj') === 0).forEach(k => { charts[k].destroy(); delete charts[k]; });
  const ps = PJ().projetos; if (!ps.length) return;
  const sem = [...Array(8)].map((_, i) => addDias(semanaIni(D.hoje), (i - 7) * 7));
  const cores = [C.s1, C.s2, C.s3, C.neon, '#22C55E', '#F43F5E', '#A78BFA'];
  if ($('#chProjSem')) charts.pjSem = new Chart($('#chProjSem'), {
    type: 'bar',
    data: { labels: sem.map(s => ddmm(s)), datasets: ps.map((p, i) => ({ label: p.nome, backgroundColor: cores[i % cores.length], borderRadius: 4, maxBarThickness: 22,
      data: sem.map(s => tarefasDe(p.nome).filter(t => t.concluida && t.concluida >= s && t.concluida < addDias(s, 7)).length) })) },
    options: opt({ x: { stacked: true }, y: { stacked: true, ticks: { precision: 0 } } }, v => v + ' tarefa(s)')
  });
  // burndown de cada sprint ativa (mesma ordem dos cartões)
  projetosOrdenados().forEach((p, i) => {
    const s = sprintAtiva(p.nome), el = $('#bd-' + i); if (!s || !el) return;
    const ts = tarefasDe(p.nome).filter(t => t.sprint === s.id), n = ts.length;
    const dias = []; for (let d = s.ini; d <= s.fim; d = addDias(d, 1)) dias.push(d);
    const real = dias.map(d => d > D.hoje ? null : n - ts.filter(t => t.status === 'Feito' && t.concluida && t.concluida <= d).length);
    const ideal = dias.map((d, k) => +(n - n * k / Math.max(1, dias.length - 1)).toFixed(2));
    charts['pjBd' + i] = new Chart(el, {
      type: 'line',
      data: { labels: dias.map(ddmm), datasets: [
        { label: 'Restantes', data: real, borderColor: C.neon, backgroundColor: 'rgba(34,211,238,.12)', fill: true, tension: .25, borderWidth: 2, pointRadius: 2, spanGaps: false },
        { label: 'Ideal', data: ideal, borderColor: C.ink2, borderDash: [5, 4], borderWidth: 1.4, pointRadius: 0 }] },
      options: opt({ y: { ticks: { precision: 0 } } }, v => num(v, 0) + ' tarefa(s)')
    });
  });
}

function abrirProjeto(nome) {
  if (projSel !== nome) verProjeto(nome);
  const card = document.querySelector(`#tab-projetos .card.proj[data-k="proj-${CSS.escape(nome)}"]`);
  if (!card) return;
  if (card.classList.contains('fechado')) card.querySelector('h3').click();
  card.scrollIntoView({ behavior: 'smooth', block: 'start' });
}
async function moverTarefa(id, status) {
  try { const r = await rpc('statusTarefa', id, status); aplicarProj(r); toast('✓ ' + r.msg, false, true); }
  catch (e) { toast('Erro: ' + e, true); }
}
/** Resposta das funções de projeto: {msg, proj}. Atualiza tudo sem recarregar. */
function aplicarProj(r, formLimpo) {
  if (r && r.proj) { D.proj = r.proj; velho = true; }
  if (abaAtual === 'projetos') { const y = window.scrollY; renderProjetos(); montado.projetos = false; montarAba('projetos'); window.scrollTo(0, y); }
  else if (abaAtual === 'registrar') { if (!formLimpo) guardarCampos(); renderRegistrar(); }
}

/* ---- atalhos que levam ao Registrar › Projetos ---- */
function novoItem(modo, proj) {
  R.pj = { proj: proj || (R.pj && R.pj.proj) || '', modo: modo };
  if (modo === 'tarefa') R.pjt = { status: 'A fazer', prio: 'Média', sprint: (sprintAtiva(R.pj.proj) || {}).id || '' };
  if (modo === 'sprint') { const n = sprintsDe(R.pj.proj).length + 1; R.pjs = { nome: 'Sprint ' + n, ini: D.hoje, fim: addDias(D.hoje, 13), status: 'Ativa' }; }
  if (modo === 'projeto') { R.pj.proj = proj || ''; R.pjp = proj ? pjpDe(proj) : { status: 'Em andamento', inicio: D.hoje }; }
  irPara('registrar', 'projetos'); window.scrollTo({ top: 0 });
}
function novaSub(paiId) {
  const pai = PJ().tarefas.find(t => t.id === paiId); if (!pai) return;
  R.pj = { proj: pai.projeto, modo: 'tarefa' }; R.pjt = { status: 'A fazer', prio: pai.prio, pai: paiId, sprint: pai.sprint };
  irPara('registrar', 'projetos'); window.scrollTo({ top: 0 });
}
function pjpDe(nome) { const p = PJ().projetos.find(x => x.nome === nome) || {}; return { original: p.nome, nome: p.nome, area: p.area, objetivo: p.objetivo, inicio: p.inicio, prazo: p.prazo, status: p.status }; }
function editarItem(tipo, id) {
  if (tipo === 'projeto') { R.pj = { proj: id, modo: 'projeto' }; R.pjp = pjpDe(id); }
  if (tipo === 'sprint') { const s = PJ().sprints.find(x => x.id === id); if (!s) return; R.pj = { proj: s.projeto, modo: 'sprint' }; R.pjs = Object.assign({}, s); }
  if (tipo === 'tarefa') { const t = PJ().tarefas.find(x => x.id === id); if (!t) return; R.pj = { proj: t.projeto, modo: 'tarefa' };
    const g = t.regra;
    R.pjt = { id: t.id, tarefa: t.tarefa, pai: t.pai, sprint: t.sprint, status: t.status, prio: t.prio, d: t.d, estim: t.estim == null ? '' : fmtIn(t.estim), obs: t.obs,
      regra: g, rep: g ? g.rep : 'Não', dias: g ? (g.dias || []).slice() : [], diaMes: g && g.diaMes ? String(g.diaMes) : '', fim: g ? g.fim || '' : '' }; }
  irPara('registrar', 'projetos'); window.scrollTo({ top: 0 });
}

/* ---- Registrar › Projetos ---- */
function formProjetos() {
  R.pj = R.pj || { proj: '', modo: 'tarefa' };
  const ps = projetosOrdenados(), pj = R.pj;
  if (!ps.length && pj.modo !== 'projeto') { pj.modo = 'projeto'; R.pjp = R.pjp || { status: 'Em andamento', inicio: D.hoje }; }
  if (pj.proj && !ps.find(p => p.nome === pj.proj)) pj.proj = '';
  if (!pj.proj && ps.length && !(pj.modo === 'projeto' && !(R.pjp || {}).original)) pj.proj = ps[0].nome;
  const novoProj = pj.modo === 'projeto' && !(R.pjp || {}).original;
  const chips = ps.map(p => `<button type="button" class="${p.nome === pj.proj && !novoProj ? 'on' : ''}" onclick="escolherProj(this.dataset.v)" data-v="${esc(p.nome)}">${esc(p.nome)}</button>`).join('')
    + `<button type="button" class="${novoProj ? 'on' : ''}" onclick="novoItem('projeto')">+ Novo projeto</button>`;
  const modos = pj.proj && !novoProj ? `<div class="seg full" style="margin-top:12px">${[['tarefa', 'Tarefa'], ['sprint', 'Sprint'], ['projeto', 'Projeto']].map(m => `<button type="button" class="${pj.modo === m[0] ? 'on' : ''}" onclick="trocarModoPj('${m[0]}')">${m[1]}</button>`).join('')}</div>` : '';
  const corpo = pj.modo === 'projeto' ? formPjProjeto() : pj.modo === 'sprint' ? formPjSprint() : formPjTarefa();
  return `<div class="card"><h3>Projetos <small>escolha o projeto</small></h3><div class="chips">${chips}</div>${modos}</div>
    ${corpo}
    ${pj.proj && !novoProj ? `<div class="card" style="margin-top:14px"><h3>Itens de ${esc(pj.proj)} <small>✎ edita · ✕ apaga</small></h3>${listaItensProj(pj.proj)}</div>` : ''}`;
}
function escolherProj(nome) { guardarCampos(); R.pj.proj = nome; if (R.pj.modo === 'projeto') R.pjp = pjpDe(nome); limparFormsPj(); renderRegistrar(); }
function trocarModoPj(m) { guardarCampos(); R.pj.modo = m; if (m === 'projeto') R.pjp = pjpDe(R.pj.proj); if (m === 'sprint' && !(R.pjs || {}).id) R.pjs = null; renderRegistrar(); }
function limparFormsPj() { R.pjt = null; R.pjs = null; }
const opcoes = (lista, atual) => lista.map(o => `<option value="${esc(o[0])}" ${o[0] === atual ? 'selected' : ''}>${esc(o[1])}</option>`).join('');

function formPjTarefa() {
  const proj = R.pj.proj, t = R.pjt = R.pjt || { status: 'A fazer', prio: 'Média', sprint: (sprintAtiva(proj) || {}).id || '' };
  t.rep = t.rep || 'Não'; t.dias = t.dias || [];
  const rec = t.rep !== 'Não';
  const diaMes = t.diaMes || (t.d ? +t.d.slice(8, 10) : +D.hoje.slice(8, 10));
  const sprints = sprintsDe(proj).filter(s => s.status !== 'Concluída' || s.id === t.sprint);
  const pais = tarefasDe(proj).filter(x => !x.pai && x.id !== t.id && (x.status !== 'Feito' || x.id === t.pai));
  const titulo = t.id ? 'Editar tarefa' : t.pai ? 'Nova subtarefa' : 'Nova tarefa';
  return `<div class="card ${t.id ? 'editando' : ''}" style="margin-top:14px"><h3>${titulo} <small>${esc(proj)}</small></h3><div class="f">
    <div class="fl"><label>Tarefa</label><input class="in" placeholder="O que precisa ser feito?" ${campo('pjt', 'tarefa')}></div>
    <div class="f2">
      <div class="fl"><label>Sprint</label><select class="in" data-k="pjt.sprint">${opcoes([['', 'Sem sprint']].concat(sprints.map(s => [s.id, s.nome + (s.status === 'Ativa' ? ' (ativa)' : '')])), t.sprint || '')}</select></div>
      <div class="fl"><label>Subtarefa de</label><select class="in" data-k="pjt.pai">${opcoes([['', '— tarefa principal —']].concat(pais.map(x => [x.id, x.tarefa])), t.pai || '')}</select></div>
    </div>
    <div class="fl"><span class="lb">Repetir</span>${seg('pjt', 'rep', ['Não', 'Diária', 'Semanal', 'Mensal'], t.rep, 'full')}</div>
    ${t.rep === 'Semanal' ? `<div class="fl"><span class="lb">Dias da semana</span>
      <div class="wk">${WK.map((l, i) => `<button type="button" class="${t.dias.indexOf(i) >= 0 ? 'on' : ''}" aria-label="${WKN[i]}" onclick="togWkPj(${i})">${l}</button>`).join('')}</div>
      <div class="quick"><button type="button" onclick="setWkPj([1,2,3,4,5])">Dias úteis</button><button type="button" onclick="setWkPj([0,6])">Fim de semana</button><button type="button" onclick="setWkPj([0,1,2,3,4,5,6])">Todos</button></div></div>` : ''}
    ${t.rep === 'Mensal' ? `<div class="fl"><label>Todo dia</label><input class="in" inputmode="numeric" placeholder="1 a 31" value="${diaMes}" data-k="pjt.diaMes"></div>` : ''}
    <div class="fl"><span class="lb">Status</span>${seg('pjt', 'status', ST_TAR, t.status, 'full')}</div>
    <div class="fl"><span class="lb">Prioridade</span>${seg('pjt', 'prio', ['Alta', 'Média', 'Baixa'], t.prio, 'full')}</div>
    <div class="f2">
      <div class="fl"><label>${rec ? (t.id ? 'Data desta ocorrência' : 'Começa em') : 'Prazo'}</label><input class="in" type="date" ${campo('pjt', 'd')}></div>
      ${rec ? `<div class="fl"><label>Repete até</label><input class="in" type="date" ${campo('pjt', 'fim')}></div>` : `<div class="fl"><label>Estimativa (h)</label><input class="in" inputmode="decimal" placeholder="opcional" ${campo('pjt', 'estim')}></div>`}
    </div>
    ${rec ? `<div class="fl"><label>Estimativa (h)</label><input class="in" inputmode="decimal" placeholder="opcional" ${campo('pjt', 'estim')}></div>` : ''}
    <div class="fl"><label>Observações</label><textarea class="in" data-k="pjt.obs" placeholder="opcional">${esc(t.obs || '')}</textarea></div>
    ${rec ? `<small style="color:var(--ink3);font-size:12px">Sempre fica uma ocorrência aberta; ao concluir, a próxima aparece sozinha, já com a mesma sprint, tarefa pai, prioridade e estimativa.${t.id && t.regra ? ' Mudar a repetição aqui vale para as próximas.' : ''}</small>` : (t.id && t.regra ? '<small style="color:var(--warn);font-size:12px">Ao salvar com "Não", esta tarefa para de se repetir.</small>' : '')}
    <button class="go" onclick="salvarPjTarefa(this)">${t.id ? 'Salvar tarefa' : (t.pai ? 'Criar subtarefa' : 'Criar tarefa') + (rec ? ' recorrente' : '')}</button>
    ${t.id || t.pai ? `<div style="display:flex;gap:8px">${t.id ? `<button class="mini ghost" style="color:var(--bad)" onclick="excluirPj('tarefa','${t.id}')">Excluir tarefa</button>` : ''}<button class="mini ghost" onclick="R.pjt=null;renderRegistrar()">Cancelar</button></div>` : ''}
  </div></div>`;
}
function formPjSprint() {
  const proj = R.pj.proj, n = sprintsDe(proj).length + 1;
  const s = R.pjs = R.pjs || { nome: 'Sprint ' + n, ini: D.hoje, fim: addDias(D.hoje, 13), status: sprintAtiva(proj) ? 'Planejada' : 'Ativa' };
  return `<div class="card ${s.id ? 'editando' : ''}" style="margin-top:14px"><h3>${s.id ? 'Editar sprint' : 'Nova sprint'} <small>${esc(proj)}</small></h3><div class="f">
    <div class="fl"><label>Nome</label><input class="in" ${campo('pjs', 'nome')}></div>

async function excluirPj(tipo, id) {
  let fn, arg, msg;
  if (tipo === 'tarefa') { const t = PJ().tarefas.find(x => x.id === id); const subs = PJ().tarefas.filter(x => x.pai === id).length;
    msg = 'Excluir a tarefa "' + (t ? t.tarefa : '') + '"' + (subs ? ' e as ' + subs + ' subtarefa(s)' : '') + '?'; fn = 'excluirTarefaProj'; arg = id; }
  if (tipo === 'sprint') { const s = PJ().sprints.find(x => x.id === id); msg = 'Excluir a sprint "' + (s ? s.nome : '') + '"? As tarefas continuam no projeto, só ficam sem sprint.'; fn = 'excluirSprint'; arg = id; }
  if (tipo === 'projeto') { const n = tarefasDe(id).length;
    if (!confirm('Excluir o projeto "' + id + '" e as sprints dele?')) return;

  try { const r = await rpc(fn, arg);

    if (tipo === 'sprint' && R.pjs && R.pjs.id === id) { R.pjs = null; R.pj.modo = 'tarefa'; }

function maiorSeq(dias, teste) {
  let best = 0, cur = 0, ini = '', bIni = '', bFim = '', ant = null;
  dias.slice().sort((a, b) => a.d < b.d ? -1 : 1).forEach(r => {
    if (!teste(r)) { cur = 0; ant = r.d; return; }
    cur = (ant && cur && addDias(ant, 1) === r.d) ? cur + 1 : 1;
    if (cur === 1) ini = r.d;
    if (cur > best) { best = cur; bIni = ini; bFim = r.d; }
    ant = r.d;

  return { n: best, de: bIni, ate: bFim };
}

function opt(escalas, fmt, semLegenda) {

      legend: { display: !semLegenda, position: 'bottom' },
      tooltip: { callbacks: { label: c => c.dataset.label + ': ' + (c.raw == null ? '—' : fmt(c.raw)) } }

    scales: {
      x: { grid: { display: false }, ticks: { maxRotation: 0, autoSkipPadding: 10 } },
      y: { beginAtZero: true, grid: { color: 'rgba(147,164,195,.08)' }, border: { display: false } }

  Object.keys(escalas || {}).forEach(k => { base.scales[k] = Object.assign({}, base.scales[k], escalas[k], { ticks: Object.assign({}, base.scales[k].ticks, (escalas[k] || {}).ticks) }); });
  return base;
}

/* ---- ritmo do dia: o dia vai das 7h às 21h; a hachura mostra onde a meta já deveria estar ---- */
const DIA_INI = 7, DIA_FIM = 21;
function fracDia() { const n = new Date(), h = n.getHours() + n.getMinutes() / 60; return Math.max(0, Math.min(1, (h - DIA_INI) / (DIA_FIM - DIA_INI))); }
/** Barra da meta de hoje com hachura do esperado até agora. p = feito (0–1). */
function barRitmo(p, ok) {
  const f = fracDia();
  return `<div class="bar rt" title="Esperado agora: ${Math.round(f * 100)}% · feito: ${Math.round(p * 100)}%"><span class="rit" style="width:${(f * 100).toFixed(1)}%"></span><i class="${ok ? 'ok' : ''}" style="width:${(p * 100).toFixed(0)}%"></i>${f > 0 && f < 1 ? `<span class="rmk" style="left:${(f * 100).toFixed(1)}%"></span>` : ''}</div>`;
}

setInterval(() => { const f = fracDia(); document.querySelectorAll('.bar.rt').forEach(b => { const r = b.querySelector('.rit'), k = b.querySelector('.rmk'); if (r) r.style.width = (f * 100).toFixed(1) + '%'; if (k) k.style.left = (f * 100).toFixed(1) + '%'; }); }, 300000);
function corUrg(sc) { // 0 verde → .5 amarelo → 1 vermelho
  const L = (a, b, t) => Math.round(a + (b - a) * t);
  const g = [74, 222, 128], y = [251, 191, 36], r = [248, 113, 113];
  const [a, b, t] = sc < .5 ? [g, y, sc / .5] : [y, r, (sc - .5) / .5];
  return `rgb(${L(a[0], b[0], t)},${L(a[1], b[1], t)},${L(a[2], b[2], t)})`;
}

}

}

function lerNd() { guardarCampos(); const r = R.fac; r.nd = { nome: r.ndNome, professor: r.ndProf, local: r.ndLocal, horario: r.ndHor, mediaAprov: r.ndMed, limiteFaltas: r.ndLim, faltas: r.ndFaltas }; return r.nd; }

/* ---- Roda da Vida ---- */

  const r = R.roda, salvas = ((D && D.roda) || []).slice().sort((a, b) => a.semana < b.semana ? 1 : -1);
  const existe = salvas.some(x => x.semana === r.semana);
  const lista = salvas.slice(0, 12).map(x => { const ns = x.notas.filter(v => v != null); return `<div class="row ${x.semana === r.semana ? 'sel' : ''}"><div><span class="t">Semana de ${ddmm(x.semana)}</span><div class="m">média ${ns.length ? num(media(ns), 1) : '—'}${x.acao ? ' · ' + esc(x.acao) : ''}</div></div>
      <div class="v" style="display:flex;gap:6px"><button class="mini ghost" onclick="carregarRoda('${x.semana}')" aria-label="Editar">✎</button><button class="mini ghost" style="color:var(--bad)" onclick="excluirRodaUI('${x.semana}', this)" aria-label="Excluir">✕</button></div></div>`; }).join('');
  return `<div class="card ${existe ? 'editando' : ''}" id="formRoda"><h3>${existe ? 'Editar Roda da Vida' : 'Roda da Vida'} <small>arraste de 0 a 10</small>${existe ? ' <button class="go2" onclick="novaRoda()">nova ›</button>' : ''}</h3><div class="f">
    <div class="fl"><label>Semana (segunda-feira)</label><input class="in" type="date" value="${r.semana}" onchange="guardarCampos(); carregarRoda(segunda(this.value))"></div>
    ${existe ? '<small style="color:var(--ink3);font-size:12px">Essa semana já foi salva: os valores abaixo são os gravados.</small>' : ''}
    <div>${F.areasRoda.map((a, i) => `<div class="rl ${r.notas[i] == null ? 'untouched' : ''}" id="rl${i}"><span style="font-weight:600;font-size:14px">${esc(a)}</span>
      <span class="nv" id="nv${i}">${r.notas[i] == null ? '—' : r.notas[i]}</span>
      <input type="range" min="0" max="10" step="1" value="${r.notas[i] == null ? 5 : r.notas[i]}" aria-label="${esc(a)}" oninput="notaRoda(${i}, this.value)"></div>`).join('')}</div>
    <div class="fl"><label>Ação para a semana seguinte</label><input class="in" placeholder="Uma ação concreta para a área mais baixa" ${campo('roda', 'acao')}></div>
    <button class="go" onclick="salvarRodaUI(this)">${existe ? 'Salvar alterações' : 'Salvar Roda da Vida'}</button>
  </div></div>

function carregarRoda(sem) {
  const x = ((D && D.roda) || []).find(w => w.semana === sem);
  R.roda = x ? { semana: sem, notas: F.areasRoda.map((_, i) => x.notas[i] == null ? null : x.notas[i]), acao: x.acao || '' } : { semana: sem, notas: F.areasRoda.map(() => null), acao: '' };

/* =================== NEGÓCIOS (múltiplas rendas) =================== */
const TIPOS_NEG = ['Serviço', 'Produto', 'Renda passiva', 'Outro'];
const CORES_NEG = ['#22D3EE', '#E879F9', '#4ADE80', '#F59E0B', '#60A5FA', '#F43F5E'];
const NEGS = () => (D && D.negocios) || [];
const VENDAS = () => (D && D.vendas) || [];
const corNeg = (n, k) => n.cor || CORES_NEG[k % CORES_NEG.length];
/** De qual negócio é esta entrada? (conta do negócio ou categoria de entrada dele) */
function negDaEntrada(x) { return NEGS().find(n => x.conta === n.conta || x.cat === n.cat) || null; }
function recebidoVenda(id) { return soma((D.fin || []).filter(x => x.tipo === 'Entrada' && x.desc && String(x.desc).split(/\s+/).indexOf('#' + id) >= 0), x => x.valor); }
function faltaVenda(v) { return v.status === 'Cancelado' ? 0 : Math.max(0, Math.round((v.valor - recebidoVenda(v.id)) * 100) / 100); }
function numerosNeg(n, mm) {
  const l = D.fin.filter(x => x.d.startsWith(mm));
  const fat = soma(l.filter(x => x.tipo === 'Entrada' && !ehAj(x) && negDaEntrada(x) === n), x => x.valor);
  const cus = soma(l.filter(x => x.tipo === 'Saída' && !ehAj(x) && x.conta === n.conta), x => x.valor);
  const ret = soma(l.filter(x => x.tipo === 'Saída' && x.cat === 'Retirada' && x.conta === n.conta), x => x.valor);
  return { fat, cus, lucro: fat - cus, ret };
}
function saldoDaConta(conta, ate) {
  const f = soma(D.fin.filter(x => x.d && x.d <= ate && x.conta === conta), x => x.tipo === 'Entrada' ? x.valor : -x.valor);
  const i = conta === CONTA_INV ? soma((D.inv || []).filter(x => x.d <= ate && x.mov !== 'Saldo'), x => x.mov === 'Resgate' ? -x.valor : x.valor) : 0;
  return f - i;
}

function renderNegocios() {
  const h = D.hoje, mm = h.slice(0, 7), ns = NEGS();
  const entMes = D.fin.filter(x => x.d.startsWith(mm) && x.tipo === 'Entrada' && !ehAj(x));
  const renda = soma(entMes, x => x.valor);
  const porFonte = {}; entMes.forEach(x => { const n = negDaEntrada(x); const k = n ? n.nome : 'Outras rendas'; porFonte[k] = (porFonte[k] || 0) + x.valor; });
  const dosNeg = soma(ns.map(n => porFonte[n.nome] || 0));
  const maior = Object.entries(porFonte).sort((a, b) => b[1] - a[1])[0];
  const dep = maior && renda ? maior[1] / renda : 0;
  const vs = VENDAS();
  const aReceber = vs.map(v => Object.assign({}, v, { falta: faltaVenda(v) })).filter(v => v.status === 'Fechado' && v.falta > 0).sort((a, b) => (a.entrega || a.d) < (b.entrega || b.d) ? -1 : 1);
  const prox = vs.filter(v => v.status !== 'Cancelado' && v.entrega && v.entrega >= h).sort((a, b) => (a.entrega + a.hora) < (b.entrega + b.hora) ? -1 : 1);
  const totRec = soma(aReceber, v => v.falta);

  const cards = ns.map((n, k) => {
    const x = numerosNeg(n, mm), cor = corNeg(n, k), sd = saldoDaConta(n.conta, h);
    const orc = vs.filter(v => v.negocio === n.nome && v.status === 'Orçamento');
    const rec = soma(aReceber.filter(v => v.negocio === n.nome), v => v.falta);
    const pm = n.meta ? Math.min(x.fat / n.meta, 1) : 0;
    const pv = prox.find(v => v.negocio === n.nome);
    return `<div class="card c6 negc lk" data-neg="${esc(n.nome)}" style="--c:${cor};${n.status === 'Pausado' ? 'opacity:.6' : ''}"><h4><span class="dot" style="background:${cor}"></span>${esc(n.nome)}<span class="tag">${esc(n.tipo)}</span>${n.status === 'Pausado' ? '<span class="tag">pausado</span>' : ''}</h4>
      <div class="mini4" style="margin-top:10px">
        <div class="tile"><div class="n">Faturado</div><div class="v pos">${brl0(x.fat)}</div></div>
        <div class="tile"><div class="n">Custos</div><div class="v neg">${brl0(x.cus)}</div></div>
        <div class="tile"><div class="n">Lucro</div><div class="v ${x.lucro >= 0 ? 'pos' : 'neg'}">${brl0(x.lucro)}${x.fat ? ` <small>${pct(x.lucro / x.fat)}</small>` : ''}</div></div>
        <div class="tile"><div class="n">Saldo do negócio</div><div class="v ${sd >= 0 ? '' : 'neg'}">${brl0(sd)}</div></div>
      </div>
      ${n.meta ? `<div class="kv" style="margin-top:8px"><span>Meta do mês</span><b>${brl0(x.fat)} / ${brl0(n.meta)}</b></div><div class="bar"><i class="${pm >= 1 ? 'ok' : ''}" style="width:${(pm * 100).toFixed(0)}%;${pm >= 1 ? '' : 'background:' + cor}"></i></div>` : ''}
      <div class="kv"><span>A receber</span><b class="${rec ? 'wrn' : ''}">${brl0(rec)}</b></div>
      <div class="kv"><span>Orçamentos abertos</span><b>${orc.length ? orc.length + ' · ' + brl0(soma(orc, v => v.valor)) : '—'}</b></div>
      <div class="kv"><span>Retirado no mês</span><b>${brl0(x.ret)}</b></div>
      <div class="kv"><span>Próximo</span><b style="font-size:13px">${pv ? esc(pv.cliente || pv.desc || 'venda') + ' · ' + ddmm(pv.entrega) + (pv.hora ? ' ' + esc(pv.hora) : '') : '—'}</b></div>
    </div>`;
  }).join('') || '<div class="card c12"><div class="empty">Nenhum negócio cadastrado. Cadastre em Registrar › Negócios.</div></div>';

  const linhaV = v => `<div class="row lk" data-venda="${v.id}"><div><span class="t">${esc(v.cliente || v.desc || 'Venda')}</span><span class="tag">${esc(v.negocio)}</span>
      <div class="m">${[v.entrega ? ddmm(v.entrega) + (v.hora ? ' ' + esc(v.hora) : '') : '', v.desc && v.cliente ? esc(v.desc) : ''].filter(Boolean).join(' · ') || ddmm(v.d)}</div>${v.local ? `<div>${linkLocal(v.local)}</div>` : ''}</div>`;
  $('#tab-negocios').innerHTML = `
  <div class="grid">
    <div class="card kpi c3"><div class="lbl">Renda do mês</div><div class="val pos">${brl0(renda)}</div><div class="sub">todas as fontes · ${mesLbl(mm)}</div></div>
    <div class="card kpi c3"><div class="lbl">Dos negócios</div><div class="val">${brl0(dosNeg)}</div><div class="sub">${renda ? pct(dosNeg / renda) + ' da renda' : 'sem renda no mês'}</div></div>
    <div class="card kpi c3"><div class="lbl">Maior fonte</div><div class="val ${dep > .7 ? 'wrn' : ''}">${maior ? pct(dep) : '—'}</div><div class="sub">${maior ? esc(maior[0]) + (dep > .7 ? ' · dependência alta' : '') : 'sem renda no mês'}</div></div>
    <div class="card kpi c3"><div class="lbl">A receber</div><div class="val ${totRec ? 'wrn' : ''}">${brl0(totRec)}</div><div class="sub">${aReceber.length} venda(s) fechada(s)</div></div>
    ${cards}
    <div class="card c12"><h3>Renda por fonte <small>12 meses</small></h3><div class="chart"><canvas id="chFontes"></canvas></div></div>
    <div class="card c6"><h3>A receber</h3>${aReceber.slice(0, 8).map(v => linhaV(v) + `<div class="v wrn">${brl(v.falta)}</div></div>`).join('') || '<div class="empty">Nada a receber.</div>'}</div>
    <div class="card c6"><h3>Próximas entregas e eventos</h3>${prox.slice(0, 8).map(v => linhaV(v) + `<div class="v" style="color:var(--ink2)">${quando(diasAte(v.entrega))}</div></div>`).join('') || '<div class="empty">Nada agendado.</div>'}</div>
  </div>`;
}
function graficosNegocios() {
  if (!window.Chart || !$('#chFontes')) return;
  const meses = [...Array(12)].map((_, i) => addMes(D.hoje.slice(0, 7), i - 11));
  const fontes = NEGS().map((n, k) => ({ nome: n.nome, cor: corNeg(n, k), n })).concat([{ nome: 'Outras rendas', cor: 'rgba(147,164,195,.45)', n: null }]);
  const ds = fontes.map(f => ({ label: f.nome, backgroundColor: f.cor, borderRadius: 3, maxBarThickness: 18, stack: 'r',
    data: meses.map(mm => soma(D.fin.filter(x => x.d.startsWith(mm) && x.tipo === 'Entrada' && !ehAj(x) && negDaEntrada(x) === f.n), x => x.valor)) })).filter(d => d.data.some(v => v));
  charts.fontes = new Chart($('#chFontes'), { type: 'bar', data: { labels: meses.map(mesLbl), datasets: ds },
    options: opt({ x: { stacked: true }, y: { stacked: true, ticks: { callback: v => brlEixo(v) } } }, v => brl(v)) });
}

/* ---- Registrar › Negócios ---- */
const novaVenda = () => ({ negocio: (NEGS().find(n => n.status !== 'Pausado') || {}).nome || '', status: 'Fechado', forma: 'Pix', d: (F && F.hoje) || D.hoje });
function formNegocios() {
  R.neg = R.neg || { modo: 'venda' }; R.nv = R.nv || novaVenda(); R.nr = R.nr || { negocio: R.nv.negocio, d: F.hoje }; R.nn = R.nn || { tipo: 'Serviço', status: 'Ativo' };
  const m = R.neg.modo, ativos = NEGS().filter(n => n.status !== 'Pausado');
  const seg = `<div class="seg full" style="margin-bottom:14px">${[['venda', 'Vendas'], ['retirada', 'Retirada'], ['cad', 'Meus negócios']].map(x => `<button type="button" class="${m === x[0] ? 'on' : ''}" onclick="guardarCampos();R.neg.modo='${x[0]}';renderRegistrar()">${x[1]}</button>`).join('')}</div>`;
  if (!NEGS().length && m !== 'cad') return seg + '<div class="card"><div class="empty">Cadastre seu primeiro negócio em "Meus negócios".</div></div>';
  const chipsNeg = (g, lista) => `<div class="chips">${lista.map(n => `<button type="button" class="${R[g].negocio === n.nome ? 'on' : ''}" onclick="setR('${g}','negocio',this.dataset.v)" data-v="${esc(n.nome)}">${esc(n.nome)}</button>`).join('')}</div>`;
  if (m === 'venda') {
    const v = R.nv, ed = !!v.id;
    const filtro = R.neg.filtro || '';
    const lista = VENDAS().filter(x => !filtro || x.negocio === filtro).slice().sort((a, b) => (a.status === 'Cancelado') - (b.status === 'Cancelado') || (faltaVenda(b) > 0) - (faltaVenda(a) > 0) || ((a.entrega || a.d) < (b.entrega || b.d) ? 1 : -1));
    const itens = lista.slice(0, R.neg.todas ? 999 : 12).map(x => { const f = faltaVenda(x), recb = recebidoVenda(x.id);
      return `<div class="row ${v.id === x.id ? 'sel' : ''}"><div style="min-width:0"><span class="t">${esc(x.cliente || x.desc || 'Venda')}</span><span class="tag">${esc(x.negocio)}</span><span class="tag ${x.status === 'Fechado' ? (f ? '' : 'ok') : x.status === 'Cancelado' ? 'late' : ''}">${x.status === 'Fechado' && !f ? 'Pago' : esc(x.status)}</span>

function progressoLivros() {

  const P = D.proj, resp = msg => ({ msg, proj: JSON.parse(JSON.stringify(P)) }), nid = p => p + Math.random().toString(36).slice(2, 8).toUpperCase();
  if (fn === 'salvarProjeto') { const o = args[0], i = P.projetos.findIndex(x => x.nome === o.original); const v = { nome: o.nome, area: o.area, objetivo: o.objetivo, inicio: o.inicio, prazo: o.prazo, status: o.status };
    if (i >= 0) { P.tarefas.concat(P.sprints).forEach(x => { if (x.projeto === o.original) x.projeto = o.nome; }); P.projetos[i] = v; } else P.projetos.push(v); return resp(i >= 0 ? 'Projeto atualizado' : 'Projeto criado'); }
  if (fn === 'excluirProjeto') { const o = args[0]; P.projetos = P.projetos.filter(x => x.nome !== o.nome); P.sprints = P.sprints.filter(x => x.projeto !== o.nome); if (o.comTarefas) P.tarefas = P.tarefas.filter(x => x.projeto !== o.nome); else P.tarefas.forEach(x => { if (x.projeto === o.nome) x.projeto = ''; }); return resp('Projeto excluído'); }
  if (fn === 'salvarSprint') { const o = Object.assign({}, args[0]); if (o.status === 'Ativa') P.sprints.forEach(x => { if (x.projeto === o.projeto && x.status === 'Ativa' && x.id !== o.id) x.status = 'Planejada'; });
    const i = P.sprints.findIndex(x => x.id === o.id); if (i >= 0) P.sprints[i] = o; else { o.id = nid('S'); P.sprints.push(o); } return resp(i >= 0 ? 'Sprint atualizada' : 'Sprint criada'); }
  if (fn === 'excluirSprint') { P.sprints = P.sprints.filter(x => x.id !== args[0]); P.tarefas.forEach(t => { if (t.sprint === args[0]) t.sprint = ''; }); return resp('Sprint excluída'); }
  if (fn === 'salvarTarefaProj') { const o = Object.assign({}, args[0]); const i = P.tarefas.findIndex(x => x.id === o.id);
    o.estim = o.estim === '' ? null : o.estim; o.concluida = o.status === 'Feito' ? ((P.tarefas[i] || {}).concluida || D.hoje) : '';
    if (o.rep && o.rep !== 'Não') { const WD = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb']; o.rec = (P.tarefas[i] || {}).rec || 'R' + Date.now(); o.regra = { rep: o.rep, dias: o.dias, diaMes: o.diaMes, fim: o.fim, ativa: true, desc: o.rep === 'Diária' ? 'todo dia' : o.rep === 'Semanal' ? 'toda ' + o.dias.map(d => WD[d]).join(', ') : 'todo dia ' + o.diaMes + ' do mês' }; }
    else { o.rec = ''; o.regra = null; }
    if (i >= 0) P.tarefas[i] = Object.assign(P.tarefas[i], o); else { o.id = nid('T'); P.tarefas.push(o); } return resp(i >= 0 ? 'Tarefa atualizada' : o.pai ? 'Subtarefa criada' : 'Tarefa criada'); }
  if (fn === 'statusTarefa') { const t = P.tarefas.find(x => x.id === args[0]); t.status = args[1]; t.concluida = args[1] === 'Feito' ? D.hoje : ''; return resp(args[1] === 'Feito' ? 'Tarefa concluída ✓' : 'Movida para ' + args[1]); }
  if (fn === 'excluirTarefaProj') { P.tarefas = P.tarefas.filter(x => x.id !== args[0] && x.pai !== args[0]); return resp('Tarefa excluída'); }
  if (fn === 'getDia') return JSON.stringify(Object.assign({ existe: !!porDia[args[0]] }, porDia[args[0]] || { d: args[0] }));
  if (['salvarHabilidade', 'excluirHabilidade', 'salvarNivel', 'excluirNivel', 'salvarConteudo', 'statusConteudo', 'excluirConteudo'].indexOf(fn) >= 0) {
    const o = args[0], K = D.conh;
    if (fn === 'salvarConteudo') { const i = K.biblioteca.findIndex(b => b.id === o.id); const v = Object.assign({}, o, { id: o.id || 'B' + Date.now(), total: o.total || null, antes: o.antes || 0, inicio: o.inicio || (o.status !== 'Quero' ? D.hoje : '') }); if (i >= 0) K.biblioteca[i] = v; else K.biblioteca.push(v); }
    if (fn === 'statusConteudo') { const b = K.biblioteca.find(x => x.id === o.id); if (o.antes !== undefined) b.antes = o.antes; if (o.status) { b.status = o.status; if (o.status === 'Em andamento') b.inicio = b.inicio || D.hoje; if (o.status === 'Concluído') b.fim = D.hoje; } }
    if (fn === 'excluirConteudo') K.biblioteca = K.biblioteca.filter(b => b.id !== o.id);
    if (fn === 'salvarNivel') { const v = { row: o.row || Date.now(), d: o.d, hab: o.hab, res: o.res, teste: o.teste, obs: o.obs }; const i = K.niveis.findIndex(n => n.row === o.row); if (i >= 0) K.niveis[i] = v; else K.niveis.push(v); K.niveis.sort((a, b) => a.d < b.d ? -1 : 1); }
    if (fn === 'excluirNivel') K.niveis = K.niveis.filter(n => n.row !== o.row);
    if (fn === 'salvarHabilidade') { const i = K.habilidades.findIndex(h => h.nome === o.original); const v = Object.assign({ meta: o.nome }, i >= 0 ? K.habilidades[i] : {}, o); if (i >= 0) K.habilidades[i] = v; else K.habilidades.push(v); }
    if (fn === 'excluirHabilidade') K.habilidades = K.habilidades.filter(h => h.nome !== o.nome);
    return { msg: fn + ' (demonstração)', conh: JSON.parse(JSON.stringify(K)) };
  }
  if (['salvarNegocio', 'excluirNegocio', 'salvarVenda', 'receberVenda', 'excluirVenda', 'salvarRetirada'].indexOf(fn) >= 0) {
    const o = args[0];
    if (fn === 'salvarVenda') { const i = D.vendas.findIndex(v => v.id === o.id); const v = Object.assign({}, o, { id: o.id || 'V' + Date.now() }); if (i >= 0) D.vendas[i] = v; else D.vendas.push(v); }
    if (fn === 'excluirVenda') D.vendas = D.vendas.filter(v => v.id !== o.id);
    if (fn === 'salvarNegocio') { const i = D.negocios.findIndex(n => n.nome === o.original); const n = Object.assign({ conta: o.nome, cat: o.nome }, i >= 0 ? D.negocios[i] : {}, { nome: o.nome, tipo: o.tipo, meta: o.meta || null, cor: o.cor, status: o.status, obs: o.obs }); if (i >= 0) D.negocios[i] = n; else D.negocios.push(n); }
    if (fn === 'excluirNegocio') D.negocios = D.negocios.filter(n => n.nome !== o.nome);
    return { msg: fn + ' (demonstração)', negocios: JSON.parse(JSON.stringify(D.negocios)), vendas: JSON.parse(JSON.stringify(D.vendas)) };
  }
  if (fn === 'editarMovimento') { const o = args[0], x = D.inv.find(m => m.row === o.row); if (x) Object.assign(x, { d: o.d, mov: o.mov, valor: o.valor, motivo: o.motivo }); return o.mov + ' corrigido (demonstração)'; }
  if (fn === 'desfazerUltimo') return 'Desfeito (demonstração)';
  return 'Salvo (demonstração, nada foi gravado)';
}

/* ---- atalhos pela URL: ?aba=registrar&form=dinheiro ---- */
function lerAtalho() {
  const p = new URLSearchParams(location.search);
  if (p.get('form')) formAtual = p.get('form');
  if (p.get('aba')) { abaAtual = p.get('aba'); if (D) trocar(abaAtual); }
}
lerAtalho();

carregar();
