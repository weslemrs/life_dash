<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LIFE DASH</title>
<meta name="theme-color" content="#060A16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LIFE DASH">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.79.0/dist/umd/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Exo+2:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<style>
:root{
  --bg:#060A16; --card:rgba(13,20,42,.74); --card2:rgba(20,30,60,.55);
  --line:rgba(56,189,248,.16); --line2:rgba(56,189,248,.34);
  --ink:#E6F1FF; --ink2:#93A4C3; --ink3:#5E6E8E;
  --neon:#22D3EE; --neon2:#E879F9;
  --s1:#0BA5C4; --s2:#C026D3; --s3:#D97706;
  --good:#4ADE80; --bad:#F87171; --warn:#FBBF24;
  --r:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{font-variant-numeric:tabular-nums;background:var(--bg);color:var(--ink);font-family:'Exo 2',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
body{
  min-height:100vh;padding-bottom:calc(92px + env(safe-area-inset-bottom));
  background:
    radial-gradient(900px 520px at 90% -12%, rgba(232,121,249,.15), transparent 60%),
    radial-gradient(820px 520px at -12% 8%, rgba(34,211,238,.15), transparent 60%),
    linear-gradient(rgba(56,189,248,.05) 1px, transparent 1px) 0 0/100% 34px,
    linear-gradient(90deg, rgba(56,189,248,.05) 1px, transparent 1px) 0 0/34px 100%,
    var(--bg);
}
.wrap{max-width:1120px;margin:0 auto;padding:18px 16px}
.hide{display:none!important}

/* ---------- topo ---------- */
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand .k{font-family:'Space Grotesk';font-size:10px;letter-spacing:.08em;color:var(--neon);text-transform:uppercase;opacity:.85}
.brand h1{font-family:'Space Grotesk';font-weight:800;font-size:22px;letter-spacing:.06em;margin-top:4px;
  background:linear-gradient(90deg,#E6F1FF,var(--neon) 55%,var(--neon2));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand .s{font-size:12px;color:var(--ink2);margin-top:4px}
.btn{font-family:'Space Grotesk';font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);background:var(--card2);
  border:1px solid var(--line2);border-radius:12px;padding:10px 12px;cursor:pointer;display:flex;align-items:center;gap:8px}
.btn:active{transform:scale(.97)}
.btn svg{width:14px;height:14px}
.demo{font-family:'Space Grotesk';font-size:9px;letter-spacing:.08em;color:#0B1020;background:var(--warn);padding:3px 8px;border-radius:6px;margin-left:8px;vertical-align:middle}

/* ---------- grade e cartões ---------- */
.grid{display:grid;gap:14px;grid-template-columns:repeat(12,1fr)}
.c12{grid-column:span 12}.c8{grid-column:span 8}.c6{grid-column:span 6}.c4{grid-column:span 4}.c3{grid-column:span 3}
@media (max-width:820px){.c8,.c6,.c4{grid-column:span 12}.c3{grid-column:span 6}}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);overflow:hidden}
.card::before{content:"";position:absolute;left:16px;right:16px;top:0;height:1px;background:linear-gradient(90deg,transparent,var(--neon),transparent);opacity:.55}
.card::after{content:"";position:absolute;right:10px;top:10px;width:8px;height:8px;border-top:1px solid var(--line2);border-right:1px solid var(--line2)}
.card h3{font-family:'Space Grotesk';font-weight:500;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);
  margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card h3 small{font-family:'Exo 2';letter-spacing:0;text-transform:none;font-size:12px;color:var(--ink3)}
.sect{font-family:'Space Grotesk';font-size:11px;letter-spacing:.12em;color:var(--neon);text-transform:uppercase;margin:6px 2px 2px;display:flex;align-items:center;gap:10px}
.sect::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line2),transparent)}

/* ---------- KPIs ---------- */
.kpi .lbl{font-family:'Space Grotesk';font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.kpi .val{font-family:'Space Grotesk';font-weight:700;font-size:clamp(17px,4.6vw,24px);margin-top:8px;line-height:1.1;white-space:nowrap;letter-spacing:-.01em}
.kpi .sub{font-size:12.5px;color:var(--ink2);margin-top:6px}
.pos{color:var(--good)}.neg{color:var(--bad)}.wrn{color:var(--warn)}

/* ---------- anéis ---------- */
.rings{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:820px){.rings{grid-template-columns:repeat(2,1fr)}}
.ring{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.ring svg{width:108px;height:108px;overflow:visible}
.ring .rv{font-family:'Space Grotesk';font-weight:700;font-size:17px;fill:var(--ink)}
.ring .rp{font-family:'Exo 2';font-size:10px;fill:var(--ink2)}
.ring .nm{font-family:'Space Grotesk';font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.ring .gl{font-size:12px;color:var(--ink3)}

/* ---------- barras e listas ---------- */
.bar{height:8px;background:rgba(147,164,195,.12);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--s1),var(--neon));box-shadow:0 0 10px rgba(34,211,238,.55)}
.loc{display:inline-flex;align-items:center;gap:3px;max-width:100%;color:var(--neon);text-decoration:none;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom}
.loc:active{opacity:.7}
.bar.rt{position:relative}
.bar.rt>i{position:relative;z-index:1}
.bar .rit{position:absolute;left:0;top:0;bottom:0;border-radius:99px 0 0 99px;background:repeating-linear-gradient(-45deg,rgba(226,236,255,.42) 0 2px,transparent 2px 5px)}
.bar .rmk{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:#E6F1FF;z-index:2;box-shadow:0 0 6px rgba(230,241,255,.8)}
.bar>i.atr{background:linear-gradient(90deg,#B45309,var(--warn));box-shadow:0 0 10px rgba(251,191,36,.4)}
.ritmo{font-size:11px;color:var(--ink3);margin-top:4px;display:flex;justify-content:space-between;gap:8px}
.ritmo .wrn{color:var(--warn)}.ritmo .pos{color:var(--good)}
.hrit{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;color:var(--ink3);letter-spacing:0;text-transform:none;font-family:'Exo 2'}
.hrit i{display:inline-block;width:16px;height:7px;border-radius:3px;background:repeating-linear-gradient(-45deg,rgba(226,236,255,.55) 0 2px,rgba(147,164,195,.15) 2px 5px)}
.bar>i.ok{background:linear-gradient(90deg,#16A34A,var(--good));box-shadow:0 0 10px rgba(74,222,128,.5)}
.bar>i.mg{background:linear-gradient(90deg,var(--s2),var(--neon2));box-shadow:0 0 10px rgba(232,121,249,.45)}
.row{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;padding:10px 0;border-bottom:1px solid rgba(147,164,195,.08)}
.row:last-child{border-bottom:0}
.row .t{font-weight:600;font-size:14px}
.row .m{font-size:12px;color:var(--ink2)}
.row.lk{cursor:pointer}.row.lk:active{background:rgba(34,211,238,.06)}.row .ed{color:var(--ink3);margin-left:4px;font-size:12px}
.row.sel{background:rgba(217,119,6,.08);border-radius:8px}
.card.editando{border-color:rgba(217,119,6,.55)}
.row .v{font-family:'Space Grotesk';font-size:13px;text-align:right;white-space:nowrap}
.row .bar{grid-column:1/-1}
.tag{display:inline-block;font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:6px;border:1px solid var(--line2);color:var(--ink2);margin-left:6px;white-space:nowrap}
.tag.late{border-color:rgba(248,113,113,.5);color:var(--bad)}
.tag.ok{border-color:rgba(74,222,128,.45);color:var(--good)}
.tag.hot{border-color:rgba(251,191,36,.5);color:var(--warn)}
.empty{color:var(--ink3);font-size:13px;padding:8px 0}

/* ---------- mapa de treinos ---------- */
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.heat .hd{font-family:'Space Grotesk';font-size:9px;color:var(--ink3);text-align:center;letter-spacing:.1em}
.cell{aspect-ratio:1;border-radius:7px;background:rgba(147,164,195,.07);border:1px solid rgba(147,164,195,.08);position:relative;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--ink3)}
.cell.on{border-color:rgba(34,211,238,.6);color:#E6FBFF;font-weight:700;flex-direction:column;gap:0;line-height:1}
.cell .ic{font-size:clamp(13px,3.6vw,19px);line-height:1;letter-spacing:-2px}.cell .ic.two{font-size:clamp(10px,2.8vw,15px)}.cell .km{font-family:'Space Grotesk';font-size:9.5px;margin-top:2px;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.cell .dn{font-size:9px;opacity:.6}
.kmt{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:6px;font-size:13px;color:var(--ink2)}.kmt b{color:var(--ink);font-family:'Space Grotesk'}
.cell.today{outline:1px solid var(--neon2);outline-offset:2px}
.cell.fut{opacity:.25}
.cell.ed{cursor:pointer;transition:transform .12s,border-color .12s}.cell.ed:hover{transform:scale(1.08);border-color:var(--neon);z-index:1}
#mtr{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;background:rgba(2,4,10,.6);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .2s}
#mtr.on{opacity:1;pointer-events:auto}
#mtr .sh{width:min(480px,100%);max-height:92vh;overflow:auto;box-sizing:border-box;padding:18px 16px calc(18px + env(safe-area-inset-bottom));border-radius:22px 22px 0 0;
  background:linear-gradient(180deg,rgba(14,20,40,.99),rgba(6,10,22,.99));border:1px solid var(--line2);border-bottom:0;box-shadow:0 -20px 60px rgba(0,0,0,.6);transform:translateY(30px);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
#mtr.on .sh{transform:none}
@media (min-width:700px){#mtr{align-items:center}#mtr .sh{border-radius:22px;border-bottom:1px solid var(--line2)}}
#mtr .hd2{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
#mtr .hd2 b{font-family:'Space Grotesk';font-size:12px;letter-spacing:.18em;color:var(--neon);text-transform:uppercase}
#mtr .x{all:unset;cursor:pointer;width:34px;height:34px;border-radius:17px;display:flex;align-items:center;justify-content:center;color:var(--ink2);border:1px solid var(--line2)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-top:12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* ---------- categorias ---------- */
.cat{display:grid;grid-template-columns:minmax(84px,1fr) 1.6fr 132px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid rgba(147,164,195,.07)}
.cat:last-child{border-bottom:0}
.cat .n{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat .r{text-align:right;font-family:'Space Grotesk';font-size:12px;white-space:nowrap}
.chip{display:inline-block;font-family:'Exo 2';font-size:11px;font-weight:700;margin-left:6px;padding:1px 6px;border-radius:6px}
.chip.up{color:var(--bad);background:rgba(248,113,113,.1)}
.chip.dn{color:var(--good);background:rgba(74,222,128,.1)}
.chip.nw{color:var(--warn);background:rgba(251,191,36,.1)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-family:'Space Grotesk';font-weight:500;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
td{padding:9px 4px;text-align:right;border-bottom:1px solid rgba(147,164,195,.07);white-space:nowrap}
td.o{font-family:'Space Grotesk';font-size:12px}

/* ---------- seletor de mês ---------- */
.months{display:flex;align-items:center;gap:8px}
.months b{font-family:'Space Grotesk';font-size:13px;letter-spacing:.1em;min-width:92px;text-align:center}
.arrow{width:34px;height:34px;border-radius:10px;border:1px solid var(--line2);background:var(--card2);color:var(--ink);cursor:pointer;font-size:16px}
.arrow:disabled{opacity:.3}

/* ---------- gráficos ---------- */
.chart{position:relative;height:210px}
.chart.tall{height:290px}

/* ---------- topo e menu inferior ---------- */
.hd-act{display:flex;gap:8px;align-items:center}
.ib{all:unset;cursor:pointer;width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;color:var(--ink);
  background:var(--card2);border:1px solid var(--line2);transition:transform .15s,border-color .2s,box-shadow .2s}
.ib:active{transform:scale(.94)}.ib svg{width:18px;height:18px}
.ib:hover{border-color:rgba(34,211,238,.6);box-shadow:0 0 16px rgba(34,211,238,.2)}
.hrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:4px}
.brand h1 .logo{all:unset;cursor:pointer;font:inherit;letter-spacing:inherit;background:inherit;-webkit-background-clip:text;background-clip:text;color:transparent}
.brand h1 .logo:active{opacity:.7}
.regbtn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:7px 12px 7px 10px;border-radius:11px;font-family:'Space Grotesk';font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  color:#06111A;background:linear-gradient(135deg,var(--neon),#E879F9);box-shadow:0 6px 18px rgba(34,211,238,.25);transition:transform .15s,filter .2s}
.regbtn svg{width:14px;height:14px}.regbtn:active{transform:scale(.95)}
.regbtn.on{filter:saturate(.4) brightness(.8);box-shadow:none}
#scrim{position:fixed;inset:0;z-index:40;background:rgba(2,4,10,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .3s}
#scrim.on{opacity:1;pointer-events:auto}
#dock{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:42;display:flex;flex-direction:column;align-items:center}
#dockBtn{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;height:52px;padding:0 18px 0 8px;border-radius:26px;
  background:rgba(8,12,26,.88);border:1px solid var(--line2);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  box-shadow:0 10px 40px rgba(0,0,0,.5),0 0 26px rgba(34,211,238,.18);transition:transform .2s,border-color .2s}
#dockBtn:active{transform:scale(.96)}
#dockBtn .ic{width:36px;height:36px;border-radius:18px;display:flex;align-items:center;justify-content:center;color:#06111A;background:var(--neon);box-shadow:0 0 14px rgba(34,211,238,.45)}
#dockBtn .ic svg{width:18px;height:18px}
#dockBtn b{font-family:'Space Grotesk';font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);white-space:nowrap}
.dock-row{display:flex;align-items:center;gap:10px}
.dnav{all:unset;cursor:pointer;width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;color:var(--neon);
  background:rgba(8,12,26,.88);border:1px solid var(--line2);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  box-shadow:0 10px 30px rgba(0,0,0,.45);transition:transform .15s,opacity .2s}
.dnav svg{width:18px;height:18px}
.dnav:active{transform:scale(.9)}
#dock.on .dnav{opacity:.25;pointer-events:none}
#dockBtn{width:222px;box-sizing:border-box}
#dockBtn b{flex:1;text-align:center}
.burger{display:flex;flex-direction:column;gap:4px;margin-left:4px;color:var(--ink2)}
.burger span{display:block;width:16px;height:2px;border-radius:2px;background:currentColor;transition:transform .3s cubic-bezier(.6,0,.2,1),opacity .2s,width .3s}
.burger span:nth-child(2){width:11px;align-self:flex-end}
#dock.on .burger span:nth-child(1){transform:translateY(6px) rotate(45deg)}
#dock.on .burger span:nth-child(2){opacity:0;width:0}
#dock.on .burger span:nth-child(3){transform:translateY(-6px) rotate(-45deg)}
#dock.on #dockBtn{border-color:rgba(34,211,238,.6)}
#dockPanel{position:absolute;bottom:64px;left:50%;width:min(400px,calc(100vw - 24px));padding:14px;border-radius:22px;
  background:linear-gradient(180deg,rgba(12,18,36,.97),rgba(6,10,22,.97));border:1px solid var(--line2);box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 0 1px rgba(34,211,238,.12);
  transform:translateX(-50%) translateY(14px) scale(.94);transform-origin:50% 100%;opacity:0;pointer-events:none;transition:transform .32s cubic-bezier(.2,.8,.2,1),opacity .22s}
#dock.on #dockPanel{transform:translateX(-50%);opacity:1;pointer-events:auto}
.dp-top{display:flex;justify-content:space-between;align-items:center;margin:0 4px 10px;font-family:'Space Grotesk';font-size:10.5px;letter-spacing:.3em;color:var(--neon)}
.dp-top .s{font-family:'Exo 2';letter-spacing:0;font-size:11px;color:var(--ink3)}
#dwItens{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.dwi{all:unset;cursor:pointer;display:flex;gap:10px;align-items:center;padding:10px;border-radius:14px;border:1px solid transparent;
  opacity:0;transform:translateY(8px);transition:opacity .28s,transform .32s cubic-bezier(.2,.8,.2,1),background .2s,border-color .2s}
#dock.on .dwi{opacity:1;transform:none}
.dwi .ic{width:34px;height:34px;flex:0 0 34px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:rgba(6,10,22,.6);border:1px solid var(--line2);color:var(--ink2)}
.dwi .ic svg{width:17px;height:17px}
.dwi b{display:block;font-family:'Space Grotesk';font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink)}
.dwi small{display:block;font-size:11px;color:var(--ink3);margin-top:1px;line-height:1.25}
.dwi:active{background:rgba(34,211,238,.06)}
.dwi.on{background:linear-gradient(90deg,rgba(34,211,238,.14),rgba(232,121,249,.06));border-color:rgba(34,211,238,.4)}
.dwi.on .ic{color:#06111A;background:var(--neon);border-color:var(--neon)}
/* ---------- projetos ---------- */
.ptiles{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:12px}
@media (max-width:820px){.ptiles{grid-template-columns:repeat(3,1fr)}}
@media (max-width:420px){.ptiles{grid-template-columns:repeat(2,1fr)}}
.ptiles .tile .v{font-size:16px;margin:4px 0 2px}.ptiles .tile .bar{margin-top:4px}
.psec{border-top:1px solid rgba(147,164,195,.1);padding-top:12px;margin-top:12px}
.pacts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.kanban{display:grid;grid-template-columns:repeat(3,minmax(220px,1fr));gap:10px;margin-top:8px;overflow-x:auto;padding-bottom:4px;scroll-snap-type:x mandatory}
.kcol{background:rgba(6,10,22,.45);border:1px solid rgba(147,164,195,.1);border-radius:14px;padding:10px;scroll-snap-align:start;min-width:0}
.kh{font-family:'Space Grotesk';font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);margin:0 2px 8px;display:flex;justify-content:space-between}
.kh b{color:var(--neon)}
.kt{background:var(--card2);border:1px solid var(--line2);border-radius:12px;padding:10px 11px;margin-bottom:8px}
.kt.alta{border-left:3px solid var(--warn)}
.kt.done{opacity:.6}.kt.done .kt-t{text-decoration:line-through}
.kt-t{font-weight:600;font-size:14px;line-height:1.3}
.kt-m{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11.5px;color:var(--ink3);margin-top:4px}
.kt-subs{margin-top:8px;display:flex;flex-direction:column;gap:4px}
.subt{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--ink2);cursor:pointer}
.subt input{accent-color:var(--neon);margin-top:2px;width:15px;height:15px}
.subt.done span{text-decoration:line-through;opacity:.6}
.kt-a{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.kb{all:unset;cursor:pointer;font-family:'Space Grotesk';font-size:12px;font-weight:600;padding:5px 9px;border-radius:8px;border:1px solid var(--line2);color:var(--ink2);background:rgba(6,10,22,.5)}

/* ---------- matriz de prioridade ---------- */
.mtz{position:relative;height:260px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:2px;margin:2px 0 0 26px;border-radius:14px;overflow:hidden}

.mtz .q span{font-family:'Space Grotesk';font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;opacity:.75}
.mtz .q1{background:rgba(251,191,36,.08)}.mtz .q1 span{color:var(--warn)}
.mtz .q2{background:rgba(248,113,113,.12);text-align:right}.mtz .q2 span{color:var(--bad)}
.mtz .q3{background:rgba(74,222,128,.07);display:flex;align-items:flex-end}.mtz .q3 span{color:var(--good)}
.mtz .q4{background:rgba(251,191,36,.08);display:flex;align-items:flex-end;justify-content:flex-end}.mtz .q4 span{color:var(--warn)}
.mtz .ax-y{position:absolute;left:-26px;top:0;bottom:0;width:22px;display:flex;flex-direction:column;justify-content:space-between;padding:12px 0}
.mtz .ax-y b{font-family:'Space Grotesk';font-size:8.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);writing-mode:vertical-rl;transform:rotate(180deg);text-align:center}
.mtz{overflow:visible}.mtz .pts{position:absolute;inset:0}
.mp{all:unset;cursor:pointer;position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:'Space Grotesk';font-weight:800;font-size:11.5px;color:#06111A;box-shadow:0 0 0 2px rgba(6,10,22,.85),0 4px 12px rgba(0,0,0,.4);transition:transform .15s}
.mp:hover,.mp:active,.mp:focus-visible{transform:scale(1.15);z-index:5}
.mtzbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:4px 0 2px;font-size:12px;color:var(--ink3)}
.mp .tip{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%) translateY(4px);white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis;
  padding:6px 10px;border-radius:9px;background:rgba(6,10,22,.96);border:1.5px solid var(--c);color:var(--c);box-shadow:0 8px 24px rgba(0,0,0,.55),0 0 14px color-mix(in srgb,var(--c) 35%,transparent);
  font-family:'Exo 2';font-weight:600;font-size:12.5px;letter-spacing:0;opacity:0;pointer-events:none;transition:opacity .12s,transform .12s}
.mp .tip small{display:block;font-weight:500;font-size:10.5px;color:var(--ink3);margin-top:1px}
.mp.tipL .tip{left:-4px;transform:translateY(4px)}.mp.tipR .tip{left:auto;right:-4px;transform:translateY(4px)}
.mp.tipB .tip{bottom:auto;top:calc(100% + 8px)}
.mp:hover .tip,.mp:focus-visible .tip{opacity:1;transform:translateX(-50%)}
.mp.tipL:hover .tip,.mp.tipR:hover .tip,.mp.tipL:focus-visible .tip,.mp.tipR:focus-visible .tip{transform:none}
.mp.late{box-shadow:0 0 0 2px rgba(6,10,22,.85),0 0 0 4px rgba(248,113,113,.7),0 0 16px rgba(248,113,113,.6)}
.ax-x{display:flex;justify-content:space-between;margin:6px 0 10px 26px;font-family:'Space Grotesk';font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.mpn{width:22px;height:22px;flex:0 0 22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-family:'Space Grotesk';font-weight:800;font-size:10.5px;color:#06111A}
[data-reg]{cursor:pointer;transition:background .2s,border-color .2s}
#tab-geral [data-reg]:hover{border-color:rgba(34,211,238,.45)}
#tab-geral .row[data-reg]:active,#tab-geral .tile[data-reg]:active{background:rgba(34,211,238,.06)}
/* ---------- blocos expansíveis ---------- */
.card > h3.col{cursor:pointer;user-select:none;-webkit-user-select:none;position:relative;padding-left:20px}
.card > h3.col .chev{position:absolute;left:0;top:50%;width:14px;height:14px;margin-top:-7px;display:flex;align-items:center;justify-content:center;color:var(--neon);transition:transform .25s}

.tl.sel{background:#F4F8FF;border-radius:14px;padding:11px 12px;margin:4px 0;border-bottom:0;box-shadow:0 0 0 1px rgba(255,255,255,.6),0 8px 24px rgba(34,211,238,.15)}

.rec-hero{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;

/* ---------- registrar ---------- */
.sub{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin-bottom:12px;scrollbar-width:none}

.f{display:grid;gap:14px}
.f2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.f,.fl,.f2>*{min-width:0}input.in,select.in,textarea.in{min-width:0;max-width:100%}
.fl{display:flex;flex-direction:column;gap:6px}
.fl>label,.lb{font-family:'Space Grotesk';font-weight:500;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}

input.in,select.in,textarea.in{width:100%;min-height:46px;padding:11px 13px;border-radius:12px;border:1px solid var(--line2);background:rgba(6,10,22,.7);color:var(--ink);
  font-family:'Exo 2';font-size:16px;outline:none;-webkit-appearance:none;appearance:none}

select.in{background-image:linear-gradient(45deg,transparent 50%,var(--ink2) 50%),linear-gradient(135deg,var(--ink2) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
input.in:focus,select.in:focus,textarea.in:focus{border-color:var(--neon);box-shadow:0 0 0 3px rgba(34,211,238,.15)}
input.big{font-family:'Space Grotesk';font-weight:700;font-size:28px;min-height:60px;text-align:center}
input[type=date].in,input[type=time].in,input[type=month].in{color-scheme:dark}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.apl{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.apb{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:3px;padding:11px 13px;border-radius:12px;border:1px solid var(--line2);background:rgba(6,10,22,.55)}
.apb b{font-family:'Exo 2';font-weight:600;font-size:13.5px;color:var(--ink)}.apb span{font-family:'Space Grotesk';font-weight:600;font-size:17px;color:var(--ink)}.apb small{font-size:11.5px;color:var(--ink3)}
.apb.on{border-color:var(--neon);box-shadow:0 0 0 1px var(--neon) inset,0 0 14px rgba(34,211,238,.2)}
.apb small.pos{color:var(--good)}.apb small.neg{color:var(--bad)}
.apb.nova{border-style:dashed;justify-content:center}.apb.nova b{color:var(--neon)}
.seg button,.chips button,.quick button{all:unset;cursor:pointer;font-family:'Exo 2';font-weight:600;font-size:14px;padding:10px 14px;min-height:22px;border-radius:11px;border:1px solid var(--line2);color:var(--ink2);background:rgba(6,10,22,.55);text-align:center}
.seg.full button{flex:1;padding:10px 6px;white-space:nowrap;font-size:13.5px}
.seg button.on,.chips button.on{color:#06111A;background:var(--neon);border-color:var(--neon);box-shadow:0 0 14px rgba(34,211,238,.35)}
.seg button.on.mg{background:#E879F9;border-color:#E879F9;box-shadow:0 0 14px rgba(232,121,249,.35)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button.nova{border-style:dashed;color:var(--neon)}
.treino{display:grid;grid-template-columns:1fr;gap:10px}@media (min-width:700px){.treino{grid-template-columns:1fr 1fr}}
.treino .tb{border:1px solid var(--line2);border-radius:14px;padding:12px;background:rgba(6,10,22,.35);display:flex;flex-direction:column;gap:10px}
.treino .th{font-family:'Space Grotesk';font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}
.habitos{border:1px solid var(--line2);border-radius:14px;padding:6px 12px 2px;background:rgba(6,10,22,.35)}.habitos .lb{margin:6px 0 2px}
#saldoDin .tile{padding:10px}#saldoDin .tile .v{font-size:clamp(12.5px,3.7vw,17px);white-space:nowrap}
.novacat{display:flex;gap:8px;margin-top:8px;align-items:stretch}.novacat .in{flex:1}.novacat .mini{padding:0 16px;display:flex;align-items:center}
.chips button{font-size:13px;padding:8px 11px}
.quick{display:flex;gap:6px;margin-top:6px}
.quick button{flex:1;font-size:12.5px;padding:8px 4px;color:var(--neon);white-space:nowrap}
.tog{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:46px;padding:0 4px}
.tog .t{font-weight:600;font-size:15px}
.sw{all:unset;cursor:pointer;width:52px;height:30px;border-radius:99px;background:rgba(147,164,195,.2);position:relative;flex:0 0 auto;transition:background .2s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#E6F1FF;transition:transform .2s}
.sw.on{background:var(--neon);box-shadow:0 0 12px rgba(34,211,238,.45)}
.sw.on::after{transform:translateX(22px);background:#06111A}
.go{all:unset;cursor:pointer;display:block;text-align:center;font-family:'Space Grotesk';font-weight:700;font-size:15px;letter-spacing:.08em;text-transform:uppercase;
  padding:15px;border-radius:14px;color:#06111A;background:linear-gradient(90deg,var(--neon),#E879F9);box-shadow:0 0 22px rgba(34,211,238,.35)}
.go:active{transform:scale(.98)}
.go[disabled]{opacity:.5;pointer-events:none}
.task.sel{background:rgba(217,119,6,.08);border-radius:10px}
.row.sel{background:rgba(217,119,6,.08);border-radius:10px;padding-left:8px;padding-right:8px}
.task{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid rgba(147,164,195,.08)}
.task:last-child{border-bottom:0}
.ck{all:unset;cursor:pointer;width:26px;height:26px;border-radius:8px;border:1.5px solid var(--line2);display:flex;align-items:center;justify-content:center;color:transparent}

.rl{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:6px 0}
.rl .nv{font-family:'Space Grotesk';font-weight:700;font-size:16px;min-width:26px;text-align:right}
.rl input[type=range]{grid-column:1/-1;width:100%;accent-color:#22D3EE;height:28px}
.rl.untouched .nv{color:var(--ink3)}
.rl.untouched input[type=range]{opacity:.45}
#toast{position:fixed;left:50%;transform:translateX(-50%) translateY(-20px);top:calc(14px + env(safe-area-inset-top));z-index:30;opacity:0;pointer-events:none;transition:all .25s;
  display:flex;align-items:center;justify-content:space-between;gap:14px;width:min(420px,calc(100vw - 32px));padding:12px 14px 12px 16px;border-radius:14px;background:rgba(8,12,26,.96);border:1px solid rgba(74,222,128,.5);box-shadow:0 10px 30px rgba(0,0,0,.5)}
#toast.show{opacity:1;pointer-events:auto;transform:translateX(-50%)}
#toast.bad{border-color:rgba(248,113,113,.6)}
#toast .tx{font-size:14px;font-weight:600}
#toast button{all:unset;cursor:pointer;font-family:'Space Grotesk';font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--neon)}


/* ---------- faculdade ---------- */
.tl{display:grid;grid-template-columns:58px 1fr auto;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid rgba(147,164,195,.08)}
.tl:last-child{border-bottom:0}
.dt{text-align:center;border:1px solid var(--line2);border-radius:12px;padding:6px 0;background:rgba(6,10,22,.5)}
.dt b{display:block;font-family:'Space Grotesk';font-weight:700;font-size:18px;line-height:1.1}
.dt span{font-family:'Space Grotesk';font-size:10px;letter-spacing:.08em;color:var(--ink2);text-transform:uppercase}
.dt.hot{border-color:rgba(248,113,113,.6);box-shadow:0 0 14px rgba(248,113,113,.18)}
.dt.warm{border-color:rgba(251,191,36,.55)}
.cd{font-family:'Space Grotesk';font-weight:700;font-size:13px;white-space:nowrap}
.negc h4{font-family:'Space Grotesk';font-weight:700;font-size:16px;display:flex;align-items:center;flex-wrap:wrap;gap:4px}

.bar>i.bad{background:linear-gradient(90deg,#B91C1C,var(--bad));box-shadow:0 0 10px rgba(248,113,113,.45)}
.bar>i.am{background:linear-gradient(90deg,#B45309,var(--warn));box-shadow:0 0 10px rgba(251,191,36,.4)}
.gr{display:grid;grid-template-columns:1fr 92px auto;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid rgba(147,164,195,.08)}

.mini{all:unset;cursor:pointer;font-family:'Space Grotesk';font-weight:700;font-size:12px;letter-spacing:.06em;padding:10px 12px;border-radius:10px;color:#06111A;background:var(--neon);text-align:center}

.wk button.on{color:#06111A;background:var(--neon);border-color:var(--neon)}


/* ---------- geral ---------- */
.hello{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px}
.hello .g{font-family:'Space Grotesk';font-weight:700;font-size:22px}

  background:linear-gradient(180deg,rgba(34,211,238,.14),rgba(232,121,249,.06))}
.acts button b{display:block;font-size:17px;color:var(--neon);line-height:1;margin-bottom:3px}
.go2{all:unset;cursor:pointer;font-family:'Space Grotesk';font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--neon);text-transform:none}
.al{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid rgba(147,164,195,.08);font-size:14px}
.al:last-child{border-bottom:0}
.al i{flex:0 0 auto;width:22px;height:22px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:700;font-size:12px}
.al.r i{background:rgba(248,113,113,.15);color:var(--bad)}

.tile .v{font-family:'Space Grotesk';font-weight:700;font-size:17px;margin:5px 0 7px}
.tile .v small{font-weight:500;font-size:12px;color:var(--ink3)}
.tile.done{border-color:rgba(74,222,128,.4)}
.mini4{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.mini4 .tile .v{margin-bottom:0}
.rings3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}

/* ---------- carregando ---------- */
.ov{position:fixed;inset:0;z-index:45;display:flex;align-items:center;justify-content:center;background:rgba(4,7,16,.62);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .18s}
.ov.show{opacity:1;pointer-events:auto}
.ov .bx{min-width:210px;max-width:80vw;padding:22px 26px;border-radius:18px;border:1px solid var(--line2);background:rgba(10,16,32,.96);text-align:center;box-shadow:0 0 30px rgba(34,211,238,.15)}
.ov .t{font-family:'Space Grotesk';font-weight:700;font-size:12px;letter-spacing:.32em;color:var(--neon)}
.ov .m{margin-top:8px;font-size:13.5px;color:var(--ink2)}

.ov.done .sp{display:none}.ov.done .ok{display:flex}.ov.done .t{color:var(--good)}
.ov.bad .sp{display:none}.ov.bad .t{color:var(--bad)}
@keyframes gira{to{transform:rotate(360deg)}}
#loading{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:var(--bg)}
#loading .t{font-family:'Space Grotesk';font-size:11px;letter-spacing:.4em;color:var(--neon)}
#loading .scan{width:180px;height:2px;background:rgba(34,211,238,.15);overflow:hidden;border-radius:2px}
#loading .scan i{display:block;width:40%;height:100%;background:linear-gradient(90deg,transparent,var(--neon),transparent);animation:scan 1.1s infinite ease-in-out}
@keyframes scan{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
.err{border-color:rgba(248,113,113,.5)}
.fade{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade,#loading .scan i{animation:none}#dockPanel,.dwi,.burger span,.chev{transition:none}}

#login{position:fixed;inset:0;z-index:60;background:radial-gradient(120% 80% at 50% 0%,#0B1328 0%,#060A16 60%);display:flex;align-items:center;justify-content:center;padding:calc(24px + env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom))}

#login .box{width:100%;max-width:380px}

<script>
/* =====================================================================
 * LIFE DASH · camada Supabase
 * Substitui o Dashboard.gs: mesmas funções, mesmos formatos de resposta, para a interface não mudar.
 * Cada usuário só enxerga os próprios dados (RLS no banco).
 * ===================================================================== */
const SB_URL = 'https://bxrihaljsxnwqthfbjqg.supabase.co';
const SB_KEY = 'sb_publishable_70r4krjmI0DADWYbzhujDA_usozgQmO';   // chave pública (pode ficar no app)
const TZ_SP = 'America/Sao_Paulo';
let sb = null;

/* ---------- datas no fuso de São Paulo ---------- */
const hojeSP = () => new Intl.DateTimeFormat('en-CA', { timeZone: TZ_SP }).format(new Date());
const agoraSP = () => { const p = new Intl.DateTimeFormat('pt-BR', { timeZone: TZ_SP, day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false }).formatToParts(new Date());
  const g = t => (p.find(x => x.type === t) || {}).value || ''; return g('day') + '/' + g('month') + ' ' + g('hour') + ':' + g('minute'); };
const isoOk = s => /^\d{4}-\d{2}-\d{2}$/.test(String(s || ''));
const addIso = (iso, k) => new Date(Date.UTC(+iso.slice(0, 4), +iso.slice(5, 7) - 1, +iso.slice(8, 10) + k)).toISOString().slice(0, 10);
const hhmm = t => t ? String(t).slice(0, 5) : '';
const n0 = v => { const x = Number(v); return v === null || v === undefined || v === '' || isNaN(x) ? 0 : x; };
const nN = v => (v === null || v === undefined || v === '' || isNaN(Number(v))) ? null : Number(v);
const vazioNum = v => (v === '' || v === null || v === undefined || isNaN(Number(v))) ? null : Number(v);
const nrm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
const reais = v => 'R$ ' + Number(v).toFixed(2).replace('.', ',');
const vazio = v => (v === null || v === undefined) ? '' : v;

/* ---------- apelidos numéricos para IDs de texto (a interface usa números em onclick) ---------- */
const ALIAS = new Map(), REV = new Map(); let aliasSeq = 9000000;
const rowDe = id => { if (typeof id === 'number') return id; if (!ALIAS.has(id)) { ALIAS.set(id, ++aliasSeq); REV.set(aliasSeq, id); } return ALIAS.get(id); };
const idDe = row => REV.has(Number(row)) ? REV.get(Number(row)) : row;

/* ---------- acesso ao banco ---------- */
function erroSB(e) {
  const m = String((e && (e.message || e.error_description)) || e);
  if (e && e.code === '23505') return 'esse registro já existe';
  if (/JWT|expired|not authenticated|Auth session/i.test(m)) return 'sua sessão expirou; entre de novo';
  if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return 'NetworkError: sem conexão';
  return m;
}
async function q(p) { const { data, error } = await p; if (error) { const err = new Error(erroSB(error)); err.code = error.code; throw err; } return data; }
const T = t => sb.from(t);
function filtrar(qb, f) { Object.keys(f || {}).forEach(k => { const v = f[k]; if (Array.isArray(v)) qb = qb.in(k, v); else if (v === null) qb = qb.is(k, null); else qb = qb.eq(k, v); }); return qb; }
/** Lê a tabela inteira (paginando de 1000 em 1000). */
async function todos(t, sel, ordem) {
  const out = [];
  for (let de = 0; ; de += 1000) {
    let qb = T(t).select(sel || '*');
    (ordem || []).forEach(o => { qb = qb.order(o[0], { ascending: o[1] !== false }); });
    const r = await q(qb.range(de, de + 999));
    out.push(...r); if (r.length < 1000) return out;
  }
}

/* ---------- desfazer: cada ação guarda como voltar ---------- */
const PK = { diario: ['data'], roda: ['semana'], perfis: ['user_id'] };
const pkDe = t => PK[t] || ['id'];
const conflitoDe = t => ({ diario: 'user_id,data', roda: 'user_id,semana', perfis: 'user_id' })[t] || 'id';
let UNDO = [];
function lerUndo() { try { return JSON.parse(localStorage.getItem('ld_undo') || '[]'); } catch (e) { return []; } }
function gravarUndo() { try { localStorage.setItem('ld_undo', JSON.stringify(UNDO)); } catch (e) {} }
async function ins(t, linhas) {
  const arr = Array.isArray(linhas) ? linhas : [linhas]; if (!arr.length) return [];
  const r = await q(T(t).insert(arr).select());
  UNDO.push({ op: 'del', t, chaves: r.map(x => pkDe(t).reduce((o, k) => (o[k] = x[k], o), {})) });
  return r;
}
async function upd(t, f, patch) {
  const antes = await q(filtrar(T(t).select('*'), f)); if (!antes.length) return [];
  await q(filtrar(T(t).update(patch), f));
  UNDO.push({ op: 'put', t, linhas: antes });
  return antes;
}
async function del(t, f) {
  const antes = await q(filtrar(T(t).select('*'), f)); if (!antes.length) return [];
  await q(filtrar(T(t).delete(), f));
  UNDO.push({ op: 'put', t, linhas: antes });
  return antes;
}
/** Atualiza a linha da chave ou cria se não existir. */
async function upsertUm(t, chave, patch) {
  const ex = await q(filtrar(T(t).select('*'), chave));
  if (ex.length) { await upd(t, chave, patch); return ex[0]; }
  return (await ins(t, Object.assign({}, chave, patch)))[0];
}
async function acao(fn) { UNDO = []; const r = await fn(); gravarUndo(); return r; }

/* ---------- regras de recorrência (iguais às do Dashboard.gs) ---------- */
const DIAS_SEM = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
const diasNum = arr => (arr || []).map(x => DIAS_SEM.indexOf(nrm(x).slice(0, 3).replace('sab', 'sáb'))).filter(n => n >= 0);
const diasTxt = nums => nums.map(d => DIAS_SEM[d]);
function descreverRegra(r) {
  if (r.rep === 'Diária') return 'todo dia';
  if (r.rep === 'Semanal') { const d = r.dias.slice().sort(); if (d.join() === '1,2,3,4,5') return 'dias úteis'; if (d.length === 7) return 'todo dia'; return 'toda ' + d.map(x => DIAS_SEM[x]).join(', '); }
  if (r.rep === 'Mensal') return 'todo dia ' + r.diaMes + ' do mês';
  return r.rep;
}
function casa(r, iso) {
  const d = new Date(Date.UTC(+iso.slice(0, 4), +iso.slice(5, 7) - 1, +iso.slice(8, 10)));
  if (r.rep === 'Diária') return true;
  if (r.rep === 'Semanal') return r.dias.indexOf(d.getUTCDay()) >= 0;
  if (r.rep === 'Mensal') { const ult = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 0)).getUTCDate(); return d.getUTCDate() === Math.min(r.diaMes || 1, ult); }
  return false;
}
function proximaData(r, desde) {
  let d = (r.inicio && r.inicio > desde) ? r.inicio : desde;
  for (let i = 0; i < 400; i++, d = addIso(d, 1)) { if (r.fim && d > r.fim) return ''; if (casa(r, d)) return d; }
  return '';
}
const regraDe = x => ({ id: x.id, tarefa: x.tarefa, area: x.area || '', prioridade: x.prioridade || 'Média', hora: hhmm(x.horario), projeto_id: x.projeto_id, rep: x.repeticao,
  dias: diasNum(x.dias_semana), diaMes: x.dia_mes || 0, inicio: x.inicio || '', fim: x.fim || '', ativa: x.ativa, sprint: x.sprint_id || '', pai: x.pai_id || '',
  estim: x.estimativa_h, obs: x.obs || '', local: x.local || '' });

/** Mantém uma ocorrência aberta por regra ativa. Devolve dd/mm da última criada. */
async function sincronizarRecorrentes(comUndo) {
  // Nas leituras (abrir/atualizar o app) a sincronização não entra no "Desfazer" da última ação do usuário.
  const I = comUndo ? ins : async (t, l) => q(T(t).insert(l).select()), U = comUndo ? upd : async (t, f, p) => q(filtrar(T(t).update(p), f));
  const regras = (await q(T('recorrentes').select('*').eq('ativa', true))).map(regraDe);
  if (!regras.length) return '';
  const hoje = hojeSP();
  const occs = await q(T('tarefas').select('id,data,status,recorrente_id').in('recorrente_id', regras.map(r => r.id)));
  let criada = '';
  for (const r of regras) {
    const occ = occs.filter(o => o.recorrente_id === r.id);
    const abertas = occ.filter(o => o.status !== 'Feito').sort((a, b) => (a.data || '') < (b.data || '') ? -1 : 1);
    if (abertas.length) {
      const a = abertas[0];
      if (a.data && a.data < hoje) { const nd = proximaData(r, hoje); if (nd) await U('tarefas', { id: a.id }, { data: nd }); }
      continue;
    }
    const ultima = occ.map(o => o.data).filter(Boolean).sort().pop();
    let desde = ultima ? addIso(ultima, 1) : (r.inicio || hoje); if (desde < hoje) desde = hoje;
    const nd = proximaData(r, desde); if (!nd) continue;
    try {
      await I('tarefas', { data: nd, tarefa: r.tarefa, area: r.area, prioridade: r.prioridade, status: 'A fazer', horario: r.hora || null, obs: r.obs || null,
        projeto_id: r.projeto_id || null, responsavel: 'Eu', recorrente_id: r.id, sprint_id: r.sprint || null, pai_id: r.pai || null,
        estimativa_h: r.estim == null ? null : r.estim, local: r.local || null });
      criada = nd.slice(8, 10) + '/' + nd.slice(5, 7);
    } catch (e) { if (e.code !== '23505') throw e; }   // outro aparelho já criou
  }
  return criada;
}

/* ---------- leitura de tudo ---------- */
async function carregarBase() {
  const [perfil, listas, diario, metas, prog, fin, inv, apl, roda, tar, proj, spr, rec, disc, aval, neg, vend, hab, niv, bib] = await Promise.all([
    q(T('perfis').select('*').maybeSingle()), todos('listas', '*', [['tipo'], ['ordem'], ['id']]), todos('diario', '*', [['data']]),
    todos('metas', '*', [['ordem'], ['nome']]), todos('progresso_metas', '*', [['data'], ['id']]), todos('financas', '*', [['data'], ['id']]),
    todos('investimentos', '*', [['data'], ['id']]), todos('aplicacoes', '*', [['nome']]), todos('roda', '*', [['semana']]),
    todos('tarefas', '*', [['data', true], ['criado_em']]), todos('projetos', '*', [['inicio'], ['nome']]), todos('sprints', '*', [['inicio'], ['nome']]),
    todos('recorrentes', '*', [['inicio']]), todos('disciplinas', '*', [['nome']]), todos('avaliacoes', '*', [['data'], ['id']]),
    todos('negocios', '*', [['nome']]), todos('vendas', '*', [['data'], ['criado_em']]), todos('habilidades', '*', [['nome']]),
    todos('niveis', '*', [['data'], ['id']]), todos('biblioteca', '*', [['inicio'], ['titulo']])
  ]);
  const B = { perfil: perfil || {}, listas, diario, metas, prog, fin, inv, apl, roda, tar, proj, spr, rec, disc, aval, neg, vend, hab, niv, bib, hoje: hojeSP() };
  B.lista = tipo => listas.filter(l => l.tipo === tipo).map(l => l.valor);
  B.metaNome = {}; metas.forEach(m => B.metaNome[m.id] = m.nome);
  B.projNome = {}; proj.forEach(p => B.projNome[p.id] = p.nome);
  B.aplNome = {}; apl.forEach(a => B.aplNome[a.id] = a);
  B.discNome = {}; disc.forEach(d => B.discNome[d.id] = d.nome);
  B.negNome = {}; neg.forEach(n => B.negNome[n.id] = n.nome);
  B.habNome = {}; hab.forEach(h => B.habNome[h.id] = h.nome);
  return B;
}

/* ---------- formatos que a interface espera ---------- */
const fmtMeta = m => ({ nome: m.nome, area: m.area || '', indicador: m.indicador || '', alvo: n0(m.alvo), unidade: m.unidade || '', periodo: m.periodo || 'Diário', ativa: !!m.ativa, fonte: m.medir || 'Manual', row: rowDe(m.id) });
const fmtProg = (B, p) => ({ d: p.data, meta: B.metaNome[p.meta_id] || '', valor: n0(p.valor) });
const fmtFin = f => ({ row: f.id, d: f.data, tipo: f.tipo, conta: f.conta, cat: f.categoria, desc: f.descricao || '', valor: n0(f.valor), forma: f.forma || '' });
const fmtMov = (B, m) => { const a = B.aplNome[m.aplicacao_id] || {}; return { row: m.id, d: m.data, ativo: a.nome || '', tipo: a.tipo || '', mov: m.movimento, valor: n0(m.valor), motivo: m.obs || '' }; };
function fmtAplicacoes(B) {
  return B.apl.map(a => {
    const movs = B.inv.filter(m => m.aplicacao_id === a.id);
    const liq = l => l.reduce((s, m) => s + (m.movimento === 'Aporte' ? n0(m.valor) : m.movimento === 'Resgate' ? -n0(m.valor) : 0), 0);
    const aplicado = liq(movs);
    const saldos = movs.filter(m => m.movimento === 'Saldo'); const ult = saldos[saldos.length - 1];
    const saldo = ult ? n0(ult.valor) : null, dataSaldo = ult ? ult.data : '';
    // saldo de hoje = último saldo informado + aportes/resgates feitos depois dele
    const estimado = saldo === null ? aplicado : saldo + liq(movs.filter(m => m.data > dataSaldo || (m.data === dataSaldo && m.id > ult.id)));
    // rendimento = quanto vale hoje − quanto você colocou de fato (aportes − resgates)
    const rend = saldo === null ? null : estimado - aplicado;
    return { nome: a.nome, inst: a.instituicao || '', tipo: a.tipo || '', obs: a.obs || '', cdi: nN(a.rende_cdi), ativa: !!a.ativa,
      aplicado: Math.round(aplicado * 100) / 100, saldo, dataSaldo, rend: rend === null ? null : Math.round(rend * 100) / 100,
      rendPct: rend === null || !(aplicado > 0) ? null : rend / aplicado, estimado: Math.round(estimado * 100) / 100, row: rowDe(a.id) };
  });
}
function fmtRent(B) {
  if (!B.inv.length) return [];
  const meses = {}; B.inv.forEach(m => { const k = m.data.slice(0, 7); meses[k] = meses[k] || { aportes: 0, resgates: 0 };
    if (m.movimento === 'Aporte') meses[k].aportes += n0(m.valor); if (m.movimento === 'Resgate') meses[k].resgates += n0(m.valor); });
  const out = []; let k = Object.keys(meses).sort()[0]; const fim = B.hoje.slice(0, 7);
  while (k <= fim) { const x = meses[k] || { aportes: 0, resgates: 0 }; out.push({ mes: k, aportes: x.aportes, resgates: x.resgates, saldo: null, rend: null, rentMes: null, rentAcum: null });
    const d = new Date(Date.UTC(+k.slice(0, 4), +k.slice(5, 7), 1)); k = d.toISOString().slice(0, 7); }
  return out;
}
const fmtDiario = r => ({ d: r.data, treinou: !!r.treinou, tipo: r.tipo_treino || '', km: n0(r.km), agua: n0(r.agua_ml), sono: nN(r.sono_h), energia: nN(r.energia),
  leitura: n0(r.leitura_pag), metaLeitura: nN(r.meta_leitura), devocional: !!r.devocional, estudo: n0(r.estudo_h), negocios: n0(r.negocios_h),
  cardio: r.cardio_modalidade || '', minCardio: n0(r.cardio_min), minCorpo: n0(r.corpo_min) });
function fmtFaculdade(B) {
  const avaliacoes = B.aval.map(a => ({ row: a.id, disciplina: B.discNome[a.disciplina_id] || '', tipo: a.tipo, desc: a.descricao || '', d: a.data || '',
    status: a.status || '', nota: nN(a.nota), peso: a.peso === null || a.peso === undefined ? 1 : n0(a.peso) }));
  const disciplinas = B.disc.map(d => ({ nome: d.nome, professor: d.professor || '', horario: d.horarios || '', local: d.local || '',

function lerDia(B, iso) {

      prioridade: t.prioridade || '', area: t.area || '', rec: t.recorrente_id || '', regra: regras[t.recorrente_id] || null, local: t.local || '' })),
    dia: lerDia(B, iso), tiposAval: B.lista('tipo_avaliacao'),
    recorrentes: B.rec.filter(r => r.ativa).map(x => { const r = regraDe(x); return { id: r.id, tarefa: r.tarefa, desc: descreverRegra(r), hora: r.hora }; }),

/** Cria, atualiza ou encerra a regra de repetição ligada a uma tarefa. */
async function aplicarRepeticao(t, o, titulo, campos, nova) {
  const rec = o.rep && o.rep !== 'Não', hoje = hojeSP();
  let dataOcc = isoOk(o.d) ? o.d : '', regraId = rec ? null : (t.recorrente_id || null), msgRep = '';
  if (rec) {
    const ex = t.recorrente_id ? await um('recorrentes', { id: t.recorrente_id }) : null;
    const dias = (o.dias || []).map(Number).filter(n => n >= 0 && n <= 6);
    const inicio = ex && ex.inicio ? ex.inicio : (dataOcc || hoje);
    const regra = { rep: o.rep, dias, diaMes: Number(o.diaMes) || Number((dataOcc || inicio).slice(8, 10)), inicio, fim: isoOk(o.fim) ? o.fim : '' };
    if (!dataOcc || (nova && !casa(regra, dataOcc))) dataOcc = proximaData(regra, dataOcc && dataOcc > hoje ? dataOcc : (hoje > inicio ? hoje : inicio)) || dataOcc || inicio;
    const dados = Object.assign({ tarefa: titulo, repeticao: regra.rep, dias_semana: diasTxt(dias), dia_mes: regra.rep === 'Mensal' ? regra.diaMes : null,
      inicio, fim: regra.fim || null, ativa: true }, campos);
    if (ex) { await upd('recorrentes', { id: ex.id }, dados); regraId = ex.id; }
    else regraId = (await ins('recorrentes', dados))[0].id;
    msgRep = ' · repete ' + descreverRegra(regra);
  } else if (t.recorrente_id) {
    await upd('recorrentes', { id: t.recorrente_id }, { ativa: false }); msgRep = ' · parou de repetir'; regraId = null;
  }
  return { regraId, msgRep, dataOcc };
}

  const tipos = {}; sem.forEach(d => { const r = porDia[d]; if (r && r.treinou) modalidades(r).forEach(t => tipos[t] = (tipos[t] || 0) + 1); });

function mesesDisponiveis() {

}
function mudarMes(k) {
  const ms = mesesDisponiveis(), i = ms.indexOf(mesSel), j = Math.max(0, Math.min(ms.length - 1, i + k));
  mesSel = ms[j];

/** Saldo estimado de uma aplicação numa data: último "Saldo" informado + aportes/resgates depois dele. */
function saldoEm(nome, ate) {
  // em ordem de data e, no mesmo dia, na ordem em que foi registrado: aporte feito depois do saldo informado conta
  const ms = D.inv.filter(x => x.ativo === nome && x.d <= ate).sort((a, b) => a.d !== b.d ? (a.d < b.d ? -1 : 1) : (a.row || 0) - (b.row || 0));
  let u = -1; ms.forEach((x, i) => { if (x.mov === 'Saldo') u = i; });
  const base = u >= 0 ? ms[u].valor : 0;
  return base + soma(ms.slice(u + 1).filter(x => x.mov !== 'Saldo'), x => x.mov === 'Resgate' ? -x.valor : x.valor);
}
let verTodosLanc = false, limiteDin = 15;
const ordenarLanc = a => a.slice().sort((x, y) => x.d !== y.d ? (x.d < y.d ? 1 : -1) : (y.row || 0) - (x.row || 0));
const sigLanc = x => x.d + '|' + Number(x.valor).toFixed(2);
/** Investido líquido num período (prefixo de data 'aaaa-mm' ou 'aaaa'): aportes − resgates. Sai da conta corrente (Pessoal). */
function invPer(pref) { const l = (D.inv || []).filter(x => x.d.startsWith(pref)); const ap = soma(l.filter(x => x.mov === 'Aporte'), x => x.valor), rs = soma(l.filter(x => x.mov === 'Resgate'), x => x.valor); return { ap, rs, liq: ap - rs }; }
const CONTA_INV = 'Pessoal';
/** Dinheiro na conta corrente no fim do dia `ate`: tudo que entrou − saiu (com ajustes) − investido líquido, desde o começo. */
function saldoConta(ate) {
  const f = soma(D.fin.filter(x => x.d && x.d <= ate), x => x.tipo === 'Entrada' ? x.valor : -x.valor);
  const i = soma((D.inv || []).filter(x => x.d <= ate && x.mov !== 'Saldo'), x => x.mov === 'Resgate' ? -x.valor : x.valor);
  return f - i;
}
const fimDoMes = mm => mm >= D.hoje.slice(0, 7) ? D.hoje : addDias(addMes(mm, 1) + '-01', -1);
const subInv = i => i.ap || i.rs ? `aportou ${brl0(i.ap)} · resgatou ${brl0(i.rs)}` : 'sem movimentos';
/** "Ajuste de saldo" acerta o acumulado com o banco: entra no que sobrou, mas não conta como entrada/gasto. */
const AJUSTE = 'Ajuste de saldo', ehAj = x => x.cat === AJUSTE || x.cat === 'Retirada', ajSinal = l => soma(l.filter(ehAj), x => x.tipo === 'Entrada' ? x.valor : -x.valor);
function linhaLanc(x, comBotoes) {
  const corpo = `<div><span class="t">${esc(x.desc || x.cat)}</span>
     <div class="m">${ddmm(x.d)} · ${esc(x.cat)} · ${esc(x.conta)}${x.forma ? ' · ' + esc(x.forma) : ''}</div></div>`;

  const ordLanc = ordenarLanc(doMes);

    <div class="card kpi c3"><div class="lbl">Saldo em conta</div><div class="val ${saldoConta(fimDoMes(m)) >= 0 ? 'pos' : 'neg'}">${brl(saldoConta(fimDoMes(m)))}</div><div class="sub">${(() => { const cs = [...new Set(D.fin.map(x => x.conta).filter(Boolean))].map(c => [c, saldoDaConta(c, fimDoMes(m))]).filter(x => Math.abs(x[1]) >= .005); return cs.length > 1 ? cs.map(x => esc(x[0]) + ' ' + brl0(x[1])).join(' · ') + '<br>' : ''; })()}${m >= D.hoje.slice(0, 7) ? 'hoje' : 'no fim de ' + mesLbl(m)} · resultado do mês ${ent - sai + ajM - iv.liq >= 0 ? '+' : '−'} ${brl0(Math.abs(ent - sai + ajM - iv.liq))}</div></div>
    <div class="card kpi c3"><div class="lbl">Investido no mês</div><div class="val ${aportes < 0 ? 'neg' : ''}">${aportes < 0 ? '− ' : ''}${brl0(Math.abs(aportes))}</div>
      <div class="sub">${subInv(iv)}${entPessoal && aportes > 0 ? ' · ' + pct(aportes / entPessoal) + ' das entradas' : ''}${metaAporte ? ' · meta ' + pct(metaAporte) : ''}</div></div>

    <div class="card c8"><h3>Saídas por categoria <small>vs ${mesLbl(p)}</small></h3>${catHtml}<div class="legend"><span><span class="chip up" style="margin:0 6px 0 0">▲</span>gastou mais</span><span><span class="chip dn" style="margin:0 6px 0 0">▼</span>gastou menos</span><span><span class="chip nw" style="margin:0 6px 0 0">novo</span>sem gasto no mês anterior</span></div></div>
    <div class="card c4"><h3>Por conta</h3><table><thead><tr><th>Conta</th><th>Entrou</th><th>Saiu</th><th>Saldo</th></tr></thead><tbody>${contas}</tbody></table></div>

    <div class="card kpi c4"><div class="lbl">Rendimento acumulado</div><div class="val ${totRend < 0 ? 'neg' : 'pos'}">${totAp ? (totRend >= 0 ? '+' : '−') + ' ' + brl0(Math.abs(totRend)) : '—'}</div><div class="sub">${totAp ? pct(totRend / totAp, 2) + ' sobre o aplicado' : 'precisa de aportes'}</div></div>

function graficosFinancas() {
  if (!window.Chart) return;
  const meses = [...Array(12)].map((_, i) => addMes(mesSel, i - 11));

  charts.trend = new Chart($('#chTrend'), {
    type: 'bar',
    data: { labels: meses.map(mesLbl), datasets: [
      { label: 'Entradas', data: meses.map(mm => tot(mm, 'Entrada')), backgroundColor: C.s1, borderRadius: 4, borderSkipped: 'start', maxBarThickness: 16 },
      { label: 'Saídas', data: meses.map(mm => tot(mm, 'Saída')), backgroundColor: C.s2, borderRadius: 4, borderSkipped: 'start', maxBarThickness: 16 }
    ] },
    options: opt({ y: { ticks: { callback: v => brlEixo(v) } } }, v => brl(v))
  });

  const movs = D.inv.slice().sort((a, b) => a.d < b.d ? -1 : 1);
  if (!movs.length) return;
  const mesesInv = []; for (let mm = movs[0].d.slice(0, 7); mm <= D.hoje.slice(0, 7); mm = addMes(mm, 1)) mesesInv.push(mm);
  const fimMes = mm => mm === D.hoje.slice(0, 7) ? D.hoje : addDias(addMes(mm, 1) + '-01', -1);
  const aps = (D.aplicacoes || []).filter(a => a.ativa || a.estimado > 0);
  const coresAp = [C.s1, C.s2, C.s3, C.neon, '#22C55E', '#F43F5E'];
  const ds = aps.map((a, k) => ({ label: a.nome, data: mesesInv.map(mm => Math.round(saldoEm(a.nome, fimMes(mm)) * 100) / 100), stack: 's',
    borderColor: coresAp[k % coresAp.length], backgroundColor: coresAp[k % coresAp.length] + '33', fill: true, tension: 0, borderWidth: 2, pointRadius: 2 }));
  ds.push({ label: 'Aplicado líquido (sem rendimento)', stack: 'a', tension: 0, data: mesesInv.map(mm => { const f = fimMes(mm); return Math.round(soma(movs.filter(x => x.d <= f && x.mov !== 'Saldo'), x => x.mov === 'Resgate' ? -x.valor : x.valor) * 100) / 100; }),
    borderColor: C.ink2, borderDash: [5, 4], borderWidth: 1.5, pointRadius: 0, fill: false });
  charts.inv = new Chart($('#chInv'), {
